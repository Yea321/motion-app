<title>MOTION — מערכת אימונים</title>
<style>
  :root{
    --bg:#0A0B0E;
    --bg-elevated:#14161C;
    --bg-card:#181B22;
    --border:#262A33;
    --blue:#2F6FED;
    --blue-bright:#5B93FF;
    --blue-dim:#132449;
    --white:#F4F5F7;
    --muted:#868C99;
    --green:#33C481;
    --red:#E5484D;
    --font-display: 'Segoe UI', Arial, sans-serif;
    --font-mono: 'Courier New', ui-monospace, monospace;
  }
  body.light-theme{
    --bg:#F4F6F9;
    --bg-elevated:#FFFFFF;
    --bg-card:#FFFFFF;
    --border:#E2E5EA;
    --blue:#2F6FED;
    --blue-bright:#1D4FC4;
    --blue-dim:#E7EEFF;
    --white:#12141A;
    --muted:#6B7280;
    --green:#1E9E63;
    --red:#D5393E;
  }
  body.light-theme .day-card,body.light-theme .exercise-item{box-shadow:0 1px 4px rgba(0,0,0,0.06);}
  body.light-theme .video-modal-fallback,body.light-theme .modal{box-shadow:0 8px 30px rgba(0,0,0,0.12);}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:var(--font-display);}
  body{min-height:100vh;}
  #app{min-height:100vh;}
  .hidden{display:none !important;}

  /* ---------- Logo ---------- */
  .motion-mark{display:inline-flex;align-items:center;gap:10px;}
  .motion-mark svg{display:block;}
  .motion-wordmark{font-weight:800;letter-spacing:2px;font-size:20px;text-transform:uppercase;}
  .motion-wordmark span{color:var(--blue-bright);}

  /* ---------- Layout shells ---------- */
  .centerscreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;}
  .centerscreen::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(47,111,237,0.16), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(47,111,237,0.10), transparent 40%);
    pointer-events:none;
  }
  .card{
    position:relative;background:var(--bg-card);border:1px solid var(--border);
    border-radius:14px;padding:32px;width:100%;max-width:400px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .card h1{font-size:15px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:0 0 24px 0;font-weight:700;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--bg-elevated);border:1px solid var(--border);color:var(--white);
    padding:11px 12px;border-radius:8px;font-size:14px;font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--blue);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--blue);color:white;border:none;border-radius:8px;
    padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:0.3px;
    transition:background .15s ease, transform .1s ease;
  }
  .btn:hover{background:var(--blue-bright);}
  .btn:active{transform:scale(0.98);}
  .btn.full{width:100%;}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--white);}
  .btn.ghost:hover{border-color:var(--blue);color:var(--blue-bright);}
  .btn.small{padding:7px 12px;font-size:12px;}
  .btn.danger{background:var(--red);}
  .linklike{background:none;border:none;color:var(--blue-bright);cursor:pointer;font-size:13px;padding:0;text-decoration:underline;}
  .error{color:var(--red);font-size:13px;margin-top:10px;}
  .muted{color:var(--muted);}
  .hint{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6;}

  /* ---------- App shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:230px;flex-shrink:0;background:var(--bg-elevated);border-left:1px solid var(--border);
    padding:22px 18px;display:flex;flex-direction:column;gap:26px;
  }
  .sidebar .who{font-size:13px;color:var(--muted);border-top:1px solid var(--border);padding-top:14px;}
  .sidebar .who b{color:var(--white);display:block;font-size:14px;margin-bottom:2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
    color:var(--muted);cursor:pointer;font-size:14px;font-weight:600;
  }
  .nav-item.active, .nav-item:hover{background:var(--blue-dim);color:var(--blue-bright);}
  .main{flex:1;padding:32px 40px;max-width:1100px;}
  .topbar{display:none;}

  @media (max-width:820px){
    .shell{flex-direction:column;}
    .main{padding:22px 18px;}
  }

  h2.page-title{font-size:22px;margin:0 0 4px 0;font-weight:800;}
  p.page-sub{color:var(--muted);font-size:13px;margin:0 0 26px 0;}

  .grid{display:grid;gap:16px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:820px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr;}}

  .panel{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;}
  .panel h3{margin:0 0 14px 0;font-size:14px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);}

  .trainee-row{
    display:flex;align-items:center;justify-content:space-between;padding:13px 14px;
    border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--bg-elevated);
  }
  .trainee-row:hover{border-color:var(--blue);}
  .trainee-row .name{font-weight:700;}
  .trainee-row .meta{font-size:12px;color:var(--muted);font-family:var(--font-mono);}
  .avatar{
    width:36px;height:36px;border-radius:50%;background:var(--blue-dim);color:var(--blue-bright);

<body>
<div id="app"></div>

<script>
/* =====================================================================
   MOTION — קליינט Supabase מינימלי (fetch ישיר ל-REST + Auth, ללא ספרייה)
   ===================================================================== */

let CONFIG = { url: 'https://gtgckiyvzqgtrfixddfg.supabase.co', anonKey: 'sb_publishable_Tv1FjYc34OXcIcZHVUDbMA_NNhEzzZs' };
let SESSION = null;    // { access_token, refresh_token, user:{id,email} }
let PROFILE = null;    // row from profiles table
let STATE = { view: 'config', activeTraineeId: null, traineeCache:{} };

/* --- שמירה מקומית: כדי שהאפליקציה תזכור התחברות בין פתיחות. --- */
function saveLocal(){
  try{
    localStorage.setItem('motion_config', JSON.stringify(CONFIG));
    if(SESSION) localStorage.setItem('motion_session', JSON.stringify(SESSION));
    else localStorage.removeItem('motion_session');
  }catch(e){ /* אחסון לא זמין - נמשיך בלי שמירה */ }
}
function clearLocal(){
  try{ localStorage.removeItem('motion_session'); }catch(e){}
}
async function refreshAccessToken(){
  if(!SESSION || !SESSION.refresh_token) return false;
  try{
    const res = await fetch(`${CONFIG.url}/auth/v1/token?grant_type=refresh_token`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey': CONFIG.anonKey },
      body: JSON.stringify({ refresh_token: SESSION.refresh_token })
    });
    if(!res.ok) return false;
    const data = await res.json();
    if(!data.access_token) return false;
    SESSION = { access_token: data.access_token, refresh_token: data.refresh_token || SESSION.refresh_token, user: data.user || SESSION.user };
    saveLocal();
    return true;
  }catch(e){
    return false;
  }
}

async function tryRestoreSession(){
  try{
    const sessRaw = localStorage.getItem('motion_session');
    if(!sessRaw) return false;
    SESSION = JSON.parse(sessRaw);
    let rows;
    try{
      rows = await rest('profiles', { query:`?id=eq.${SESSION.user.id}&select=*` });
    }catch(innerErr){
      // ה-access token כנראה פג תוקף (בד"כ אחרי שעה) - ננסה לרענן אותו עם ה-refresh token ולנסות שוב
      const refreshed = await refreshAccessToken();
      if(!refreshed) throw innerErr;
      rows = await rest('profiles', { query:`?id=eq.${SESSION.user.id}&select=*` });
    }
    if(!rows || !rows.length) throw new Error('no profile');
    PROFILE = rows[0];
    updateLastLogin();
    STATE.view = (PROFILE.role === 'trainee' && PROFILE.is_suspended) ? 'suspended' : (PROFILE.role === 'coach' ? 'coach' : 'trainee');
    return true;
  }catch(e){
    SESSION = null; PROFILE = null;
    clearLocal();
    return false;
  }
}

function updateLastLogin(){
  if(!PROFILE) return;
  rest('profiles', { method:'PATCH', query:`?id=eq.${PROFILE.id}`, body:{ last_login_at: new Date().toISOString() } }).catch(()=>{});
}
function formatLastLogin(ts){
  if(!ts) return 'מעולם לא התחבר/ה';
  const d = new Date(ts);
  const diffMin = Math.floor((Date.now() - d.getTime())/60000);
  if(diffMin < 1) return 'כרגע';
  if(diffMin < 60) return `לפני ${diffMin} דק'`;
  const diffHr = Math.floor(diffMin/60);
  if(diffHr < 24) return `לפני ${diffHr} שע'`;
  const diffDay = Math.floor(diffHr/24);
  if(diffDay === 1) return 'אתמול';
  if(diffDay < 30) return `לפני ${diffDay} ימים`;
  return d.toLocaleDateString('he-IL');
}

function showToast(msg, isError){
  const el = document.createElement('div');
  el.className = 'toast';
  if(isError) el.style.borderColor = 'var(--red)';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

async function authRequest(path, body){
  const res = await fetch(`${CONFIG.url}/auth/v1/${path}`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'apikey': CONFIG.anonKey },
    body: JSON.stringify(body)
  });
  const rawText = await res.text();
  let data = {};
  try{ data = JSON.parse(rawText); }catch(e){ data = {}; }
  if(!res.ok){
    const detail = data.error_description || data.msg || data.error || data.message || data.error_code || rawText || (res.status + ' ' + res.statusText);
    throw new Error(`(${res.status}) ${detail}`);
  }
  return data;
}

async function rest(table, { method='GET', query='', body=null, token=null, prefer=null, _retried=false } = {}){
  const headers = { 'Content-Type':'application/json', 'apikey': CONFIG.anonKey };
  headers['Authorization'] = 'Bearer ' + (token || (SESSION && SESSION.access_token) || CONFIG.anonKey);
  if(prefer) headers['Prefer'] = prefer;
  const res = await fetch(`${CONFIG.url}/rest/v1/${table}${query}`, {
    method, headers, body: body ? JSON.stringify(body) : undefined
  });
  if(res.status === 401 && !token && !_retried && SESSION && SESSION.refresh_token){
    const refreshed = await refreshAccessToken();
    if(refreshed) return rest(table, { method, query, body, prefer, _retried:true });
  }
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error(`שגיאת שרת (${table}): ${errText || res.status}`);
  }
  if(res.status === 204) return null;
  return res.json().catch(()=>null);
}

async function uploadPhoto(file, userId){
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
  const path = `${userId}/${Date.now()}.${ext}`;
  const res = await fetch(`${CONFIG.url}/storage/v1/object/motion-photos/${path}`, {
    method:'POST',
    headers:{
      'apikey': CONFIG.anonKey,
      'Authorization': 'Bearer ' + (SESSION && SESSION.access_token || CONFIG.anonKey),
      'Content-Type': file.type || 'image/jpeg'
    },
    body: file
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error('העלאת התמונה נכשלה: ' + (t || res.status) + ' (ודאי שהרצת את motion-supabase-schema-v2-addon.sql)');
  }
  return `${CONFIG.url}/storage/v1/object/public/motion-photos/${path}`;
}

function exportCSV(filename, headers, rows){
  const escape = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const csv = '\uFEFF' + [headers.map(escape).join(',')].concat(
    rows.map(r => r.map(escape).join(','))
  ).join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

let REST_TIMER_INTERVAL = null;
function playDingSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 1200;
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.22);
  }catch(e){}
}
function fireConfetti(big){
  const colors = ['#2F6FED','#5B93FF','#33C481','#F4F5F7','#FFD166'];
  const count = big ? 90 : 40;
  for(let i=0;i<count;i++){
    const el = document.createElement('div');
    const size = 6 + Math.random()*6;
    el.style.cssText = `position:fixed;top:-20px;left:${Math.random()*100}vw;width:${size}px;height:${size*0.4}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};z-index:200;pointer-events:none;
      border-radius:2px;opacity:0.95;`;
    const duration = 1800 + Math.random()*1400;
    const drift = (Math.random()-0.5) * 200;
    const rotate = Math.random()*720 - 360;
    document.body.appendChild(el);
    const anim = el.animate([
      { transform: `translate(0,0) rotate(0deg)`, opacity: 1 },
      { transform: `translate(${drift}px, ${window.innerHeight + 40}px) rotate(${rotate}deg)`, opacity: 0.9 }
    ], { duration, easing:'cubic-bezier(.25,.46,.45,.94)' });
    anim.onfinish = () => el.remove();
  }
}

function playTimerEndSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.18].forEach(delay => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, ctx.currentTime + delay);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.15);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + delay);
      osc.stop(ctx.currentTime + delay + 0.16);
    });
  }catch(e){ /* דפדפן לא תומך - לא קריטי */ }
}
function startRestTimer(seconds){
  stopRestTimer();
  const fab = document.getElementById('timerFabBtn');
  if(fab) fab.remove();
  let remaining = seconds;
  const bar = document.createElement('div');
  bar.className = 'rest-timer-bar';
  bar.id = 'restTimerBar';
  bar.innerHTML = `
    <div>
      <div class="rt-label">⏱ מנוחה בין סטים</div>
      <div class="rt-count" id="rtCount">${remaining}</div>
    </div>
    <div class="rt-actions">
      <button class="btn ghost small" id="rtAdd30">+30 שנ׳</button>
      <button class="btn small" id="rtSkip">דילוג</button>
    </div>`;
  document.body.appendChild(bar);
  document.getElementById('rtAdd30').onclick = () => { remaining += 30; document.getElementById('rtCount').textContent = remaining; };
  document.getElementById('rtSkip').onclick = () => stopRestTimer();
  REST_TIMER_INTERVAL = setInterval(() => {
    remaining--;
    const el = document.getElementById('rtCount');
    if(el) el.textContent = remaining;
    if(remaining <= 0){
      showToast('⏱ זמן המנוחה נגמר - לחזרה הבאה!');
      playTimerEndSound();
      if(navigator.vibrate) navigator.vibrate([200,100,200]);
      stopRestTimer();
    }
  }, 1000);
}
function stopRestTimer(){
  if(REST_TIMER_INTERVAL) clearInterval(REST_TIMER_INTERVAL);
  REST_TIMER_INTERVAL = null;
  const bar = document.getElementById('restTimerBar');
  if(bar) bar.remove();
  if(document.querySelector('[data-daycard]')) renderTimerFab();
}

function findLastLoggedValues(exerciseName, allDays, beforeDayNumber){
  const norm = s => (s||'').trim().toLowerCase();
  const matches = [];
  allDays.forEach(d => {
    if(d.day_number >= beforeDayNumber) return;
    (d.exercises || []).forEach(ex => {
      if(norm(ex.name) === norm(exerciseName) && (ex.actual_weight_kg!=null || ex.actual_reps!=null || ex.actual_sets!=null)){
        matches.push({ day_number: d.day_number, sets: ex.actual_sets, reps: ex.actual_reps, weight: ex.actual_weight_kg });
      }
    });
  });
  matches.sort((a,b)=>b.day_number-a.day_number);
  return matches[0] || null;
}
function findMaxLoggedWeight(exerciseName, allDays, excludeDayNumber){
  const norm = s => (s||'').trim().toLowerCase();
  let max = null;
  allDays.forEach(d => {
    if(d.day_number === excludeDayNumber) return;
    (d.exercises || []).forEach(ex => {
      if(norm(ex.name) === norm(exerciseName) && ex.actual_weight_kg!=null){
        if(max === null || ex.actual_weight_kg > max) max = ex.actual_weight_kg;
      }
    });
  });
  return max;
}

function calcStreak(days){
  // רצף ימי אימון: סופרת אחורה מהיום המספרי הגבוה ביותר שסומן/חלף, ימי מנוחה לא שוברים רצף
  const sorted = days.slice().sort((a,b)=>b.day_number-a.day_number);
  let streak = 0;
  for(const d of sorted){
    if(d.is_rest_day) continue;
    if(d.completed) streak++;
    else break;
  }
  return streak;
}

];

  return `${firstName}, ${line}`;

function dayDate(startDateStr, dayNumber){
  const d = new Date(startDateStr);
  d.setDate(d.getDate() + (dayNumber - 1));
  return d;
}
function dayLabel(startDateStr, dayNumber){
  const d = dayDate(startDateStr, dayNumber);
  return { weekday: HEBREW_WEEKDAYS[d.getDay()], dateStr: d.toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit'}), fullDate: d.toLocaleDateString('he-IL'), dateObj: d };
}
function groupDaysByCalendarWeek(days, startDateStr){
  // מקבצת ימים לפי שבוע קלנדרי אמיתי (ראשון-שבת), לא לפי בלוקים גולמיים של 7 ימים מתאריך ההתחלה
  const groups = {};
  days.forEach(d => {
    const date = dayDate(startDateStr, d.day_number);
    date.setHours(0,0,0,0);
    const sunday = new Date(date);
    sunday.setDate(sunday.getDate() - sunday.getDay());
    const key = sunday.getTime();
    if(!groups[key]) groups[key] = [];
    groups[key].push(d);
  });
  const keys = Object.keys(groups).map(Number).sort((a,b)=>a-b);
  const todaySunday = new Date(); todaySunday.setHours(0,0,0,0); todaySunday.setDate(todaySunday.getDate() - todaySunday.getDay());
  const todayKey = todaySunday.getTime();
  return keys.map((key, idx) => ({
    weekNum: idx+1,
    isCurrentWeek: key === todayKey,
    days: groups[key].slice().sort((a,b)=>a.day_number-b.day_number)
  }));
}

function progressRing(pct, size){
  size = size || 64;
  const r = (size/2) - 8;
  const c = 2*Math.PI*r;
  const offset = c - (Math.max(0,Math.min(100,pct))/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}"/>
    <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
  </svg>`;
}

    try{

      const rows = await rest('profiles', { query:`?id=eq.${data.user.id}&select=*` });
      if(!rows || !rows.length) throw new Error('לא נמצא פרופיל למשתמש זה.');
      PROFILE = rows[0];
      saveLocal();
      updateLastLogin();
      STATE.view = (PROFILE.role === 'trainee' && PROFILE.is_suspended) ? 'suspended' : (PROFILE.role === 'coach' ? 'coach' : 'trainee');

async function renderCoachHome(){
  const app = document.getElementById('app');
  app.innerHTML = appShell(

    `<div class="panel"><div class="skeleton skel-row"></div><div class="skeleton skel-row"></div><div class="skeleton skel-row"></div></div>`
  );
  bindShellNav({ home: renderCoachHome });

  let trainees = [];
  try{
    trainees = await rest('profiles', { query:`?coach_id=eq.${PROFILE.id}&select=*&order=created_at.desc` }) || [];
  }catch(e){ showToast(e.message, true); }

  let statsByTrainee = {};
  if(trainees.length){
    try{
      const ids = trainees.map(t=>t.id).join(',');
      const progressAll = await rest('progress_entries', { query:`?trainee_id=in.(${ids})&select=trainee_id,weight_kg,entry_date&order=entry_date.asc` }) || [];
      const programsAll = await rest('programs', { query:`?trainee_id=in.(${ids})&select=trainee_id,start_date,program_days(day_number,completed,is_rest_day)&order=start_date.desc` }) || [];
      trainees.forEach(t => {
        const mine = progressAll.filter(p=>p.trainee_id===t.id);
        const lastW = mine.length ? mine[mine.length-1].weight_kg : null;
        const lastEntryDate = mine.length ? new Date(mine[mine.length-1].entry_date) : null;
        const daysSince = lastEntryDate ? Math.floor((Date.now()-lastEntryDate.getTime())/86400000) : null;
        const prog = programsAll.find(p=>p.trainee_id===t.id);
        const dueProgDays = prog ? (prog.program_days||[]).filter(d => dayDate(prog.start_date, d.day_number) <= new Date()) : [];
        const workDays = dueProgDays.filter(d=>!d.is_rest_day);
        const adherence = workDays.length ? Math.round(100*workDays.filter(d=>d.completed).length/workDays.length) : null;
        statsByTrainee[t.id] = { lastW, adherence, daysSince };
      });

  const rowsHtml = trainees.length ? trainees.map(t => {

            ${s.adherence!=null ? `<span>💪 <b>${s.adherence}%</b> עמידה בתוכנית</span>` : ''}
            <span>🕐 ${formatLastLogin(t.last_login_at)}</span>
            ${(s.daysSince===null || s.daysSince>=7) ? `<span style="color:var(--red);">⚠ ${s.daysSince===null?'אין פעילות':`${s.daysSince} ימים ללא עדכון`}</span>` : ''}
          </div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="icon-btn" data-delete-trainee="${t.id}" data-name="${t.full_name}" title="מחיקת מתאמן">🗑</button>
        <div class="muted">›</div>
      </div>
    </div>`;
  }).join('') : `<div class="empty">${logoSVG(46)}<div>עדיין אין מתאמנים. הוסיפי את הראשון/ה שלך.</div></div>`;

  document.querySelector('.main').innerHTML = `

    <div class="panel" id="traineesPanel">${rowsHtml}</div>

function openMoveDayModal(dayId, currentNum, program, onDone){
  onDone = onDone || renderCoachTraineeDetail;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const totalDays = program.duration_days || (program.program_days||[]).length;
  const byNumber = {};
  (program.program_days || []).forEach(d => { byNumber[d.day_number] = d; });
  // תמיד משאירה מרווח של שבועיים לפני יום 1, כדי שאפשר יהיה להזיז אימון גם ל"אתמול"/לפני תחילת התוכנית הרשמית
  const startN = Math.min(1, currentNum - 14, -13);
  const options = [];
  for(let n=startN; n<=totalDays; n++){
    const lbl = dayLabel(program.start_date, n);
    const existing = byNumber[n];
    let suffix = '';
    if(n === currentNum) suffix = ' (היום הנוכחי)';
    else if(existing) suffix = existing.is_rest_day ? ' — כרגע יום מנוחה' : ` — כרגע: ${existing.title || 'אימון'} (יוחלף)`;
    else suffix = ' — ריק';
    options.push(`<option value="${n}" ${n===currentNum?'selected':''}>${lbl.weekday}, ${lbl.dateStr}${suffix}</option>`);
  }
  bg.innerHTML = `
    <div class="modal">
      <h3>העברת האימון ליום אחר</h3>
      <div class="field">
        <label>לאיזה יום להעביר?</label>
        <select id="moveDaySelect">${options.join('')}</select>
      </div>
      <p class="muted" style="font-size:12px;">אם היום הנבחר כבר תפוס באימון אחר, שני האימונים יוחלפו ביניהם.</p>
      <div id="moveErr" class="error hidden"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="moveCancel">ביטול</button>
        <button class="btn full" id="moveConfirm">העברה</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  document.getElementById('moveCancel').onclick = () => bg.remove();
  document.getElementById('moveConfirm').onclick = async () => {
    const errEl = document.getElementById('moveErr');
    const targetNum = parseInt(document.getElementById('moveDaySelect').value);
    if(isNaN(targetNum)){ errEl.textContent = 'נא לבחור יום.'; errEl.classList.remove('hidden'); return; }
    if(targetNum === currentNum){ bg.remove(); return; }
    try{
      const allDays = program.program_days || [];
      const targetDay = allDays.find(d => d.day_number === targetNum);
      const targetLbl = dayLabel(program.start_date, targetNum);
      if(targetDay){
        await rest('program_days', { method:'PATCH', query:`?id=eq.${targetDay.id}`, body:{ day_number: -99999 } });
        await rest('program_days', { method:'PATCH', query:`?id=eq.${dayId}`, body:{ day_number: targetNum } });
        await rest('program_days', { method:'PATCH', query:`?id=eq.${targetDay.id}`, body:{ day_number: currentNum } });
        showToast(`הוחלף עם ${targetLbl.weekday}, ${targetLbl.dateStr}`);
      } else {
        await rest('program_days', { method:'PATCH', query:`?id=eq.${dayId}`, body:{ day_number: targetNum } });
        showToast(`הועבר ל${targetLbl.weekday}, ${targetLbl.dateStr}`);
      }
      bg.remove();
      onDone();
    }catch(e){
      errEl.textContent = e.message;
      errEl.classList.remove('hidden');
    }
  };
}

function openAdherenceBoardModal(program, onDone){
  onDone = onDone || renderCoachTraineeDetail;
  const existingDays = (program.program_days || []).slice().sort((a,b)=>a.day_number-b.day_number);
  const byNumber = {};
  existingDays.forEach(d => { byNumber[d.day_number] = d; });
  const today = new Date(); today.setHours(0,0,0,0);
  const totalDays = program.duration_days || existingDays.length;
  const cellsHtml = [];
  for(let n=1; n<=totalDays; n++){
    const d = byNumber[n];
    const lbl = dayLabel(program.start_date, n);
    const cellDate = lbl.dateObj; cellDate.setHours(0,0,0,0);
    const isToday = cellDate.getTime() === today.getTime();
    const isPast = cellDate.getTime() < today.getTime();
    let cls = '';
    if(!d) cls = 'rest'; // יום שעדיין לא נבנה - מוצג מעומעם כמו יום מנוחה
    else if(d.is_rest_day) cls = 'rest';
    else if(d.completed) cls = 'done';
    else if(isPast) cls = 'missed';
    if(isToday) cls += ' today';
    const canMove = d && !d.is_rest_day;
    const titleText = d ? `${lbl.weekday} — ${lbl.fullDate}${d.title ? ' · '+d.title : ''}${canMove ? ' (לחיצה להעברה ליום אחר)' : ''}` : `${lbl.weekday} — ${lbl.fullDate} · טרם נבנה`;
    cellsHtml.push(`<div class="board-cell ${cls}" title="${titleText}" ${canMove ? `data-boardmove="${d.id}" data-boardnum="${n}" style="cursor:pointer;"` : ''}>
      <span style="font-size:12px;">${lbl.weekday.replace('יום ','')}</span>
      <span style="font-size:9px;opacity:0.8;">${lbl.dateStr}</span>
    </div>`);
  }
  const workDays = existingDays.filter(d=>!d.is_rest_day);
  const completedCount = workDays.filter(d=>d.completed).length;
  const missedCount = workDays.filter(d => {
    const cellDate = dayDate(program.start_date, d.day_number); cellDate.setHours(0,0,0,0);
    return !d.completed && cellDate.getTime() < today.getTime();
  }).length;
  const notBuiltCount = totalDays - existingDays.length;
  const startLbl = new Date(program.start_date).toLocaleDateString('he-IL');
  const endLbl = dayDate(program.start_date, program.duration_days).toLocaleDateString('he-IL');

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal" style="max-width:640px;">
      <h3>${program.title}</h3>
      <p class="muted" style="font-size:13px;margin-top:-8px;">${startLbl} — ${endLbl} · ${completedCount}/${workDays.length} אימונים הושלמו${missedCount ? ` · ${missedCount} הוחמצו` : ''}${notBuiltCount>0 ? ` · ${notBuiltCount} ימים עדיין לא נבנו` : ''}</p>
      <p class="muted" style="font-size:12px;">💡 לוחצים על יום אימון (לא מנוחה) כדי להעביר אותו ליום אחר</p>
      <div class="board-grid">${cellsHtml.join('')}</div>
      <div class="board-legend">
        <span><span class="legend-dot" style="background:var(--green);"></span>בוצע</span>
        <span><span class="legend-dot" style="background:rgba(229,72,77,0.4);border:1px solid var(--red);"></span>הוחמץ</span>
        <span><span class="legend-dot" style="background:var(--bg-elevated);border:1px dashed var(--border);"></span>מנוחה / טרם נבנה</span>
        <span><span class="legend-dot" style="background:var(--bg-elevated);border:1px solid var(--border);"></span>ממתין</span>
        <span><span class="legend-dot" style="outline:2px solid var(--blue-bright);background:var(--bg-elevated);"></span>היום</span>
      </div>
      <div class="modal-actions"><button class="btn full" id="boardClose">סגירה</button></div>
    </div>`;
  document.body.appendChild(bg);
  document.getElementById('boardClose').onclick = () => bg.remove();
  bg.onclick = (ev) => { if(ev.target === bg) bg.remove(); };
  bg.querySelectorAll('[data-boardmove]').forEach(cell => {
    cell.onclick = (ev) => {
      ev.stopPropagation();
      const dayId = cell.getAttribute('data-boardmove');
      const currentNum = parseInt(cell.getAttribute('data-boardnum'));
      bg.remove();
      openMoveDayModal(dayId, currentNum, program, onDone);
    };
  });
}

/* =====================================================================
   מסך מאמן — פרטי מתאמן: היקפים / משקל + עריכת תוכנית
   ===================================================================== */
function svgLineChart(points, w, h, goal){
  // points: [{x: index, y: value}]
  w = w || 560; h = h || 160;
  if(!points.length) return `<div class="empty">אין עדיין נתוני משקל</div>`;
  const vals = points.map(p=>p.y).concat(goal!=null ? [parseFloat(goal)] : []);
  const min = Math.min(...vals), max = Math.max(...vals);
  const pad = 24;
  const range = (max - min) || 1;
  const stepX = points.length > 1 ? (w - pad*2) / (points.length - 1) : 0;
  const coords = points.map((p,i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((p.y - min) / range) * (h - pad*2);
    return [x,y];
  });
  const path = coords.map((c,i) => (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const dots = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="#5B93FF"/>`).join('');
  let goalLine = '';
  if(goal!=null){
    const gy = h - pad - ((parseFloat(goal) - min) / range) * (h - pad*2);
    goalLine = `<line x1="${pad}" y1="${gy.toFixed(1)}" x2="${w-pad}" y2="${gy.toFixed(1)}" stroke="#33C481" stroke-width="1.5" stroke-dasharray="5,4"/>`;
  }
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="overflow:visible;">
    ${goalLine}
    <path d="${path}" fill="none" stroke="#2F6FED" stroke-width="2.5"/>
    ${dots}
  </svg>`;
}

    programs = await rest('programs', { query:`?trainee_id=eq.${tid}&select=*,program_days(*,exercises(*))&order=start_date.desc` }) || [];
    nutritionPlans = await rest('nutrition_plans', { query:`?trainee_id=eq.${tid}&select=*,meals(*)&order=created_at.desc` }) || [];
  }catch(e){ showToast(e.message, true); return; }
  let nutritionLogs = [];
  try{ nutritionLogs = await rest('nutrition_logs', { query:`?trainee_id=eq.${tid}&select=*&order=log_date.desc&limit=10` }) || []; }catch(e){}

  const nutritionPlan = nutritionPlans[0] || null;
  const mealsList = nutritionPlan ? (nutritionPlan.meals || []).slice().sort((a,b)=>a.order_index-b.order_index) : [];

  let program = programs[0] || null;

  const firstWeight = progress.length ? progress[0].weight_kg : null;
  const delta = (lastWeight!=null && firstWeight!=null) ? (lastWeight - firstWeight).toFixed(1) : null;

      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${program ? `<button class="btn ghost small" id="showBoardBtn">🗓 לוח 90 יום</button>` : ''}
        ${progress.length ? `<button class="btn ghost small" id="exportCoachBtn">⬇ ייצוא CSV</button>` : ''}

        <button class="btn ghost small" id="toggleSuspendBtn" style="${trainee.is_suspended ? 'border-color:var(--green);color:var(--green);' : ''}">${trainee.is_suspended ? '▶ ביטול השהיה' : '⏸ השהיה זמנית'}</button>

    </div>
    ${trainee.is_suspended ? `<div class="reminder-banner" style="background:rgba(229,72,77,0.12);border-color:var(--red);"><span>⏸ המתאמן/ת מושהה כרגע - לא יכול/ה להתחבר לאפליקציה עד שתבטלי את ההשהיה.</span></div>` : ''}

      <div class="panel stat"><div class="v" style="color:${delta<0?'var(--green)':delta>0?'var(--red)':'var(--white)'}">${delta!=null ? (delta>0?'+':'')+delta : '—'}</div><div class="l">שינוי כולל (ק"ג)</div></div>

          <td>${p.photo_url ? `<img class="photo-thumb" src="${p.photo_url}" data-full="${p.photo_url}">` : ''}</td>
          <td>${new Date(p.entry_date).toLocaleDateString('he-IL')}</td>
          <td>${p.weight_kg ?? '-'}</td><td>${p.chest_cm ?? '-'}</td><td>${p.waist_cm ?? '-'}</td>
          <td>${p.hips_cm ?? '-'}</td><td>${p.arm_cm ?? '-'}</td><td>${p.thigh_cm ?? '-'}</td>
        </tr>`).join('')}
      </table>` : `<div class="empty">המתאמן טרם הזין נתוני מדידה</div>`}
    </div>

    <div class="panel" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">
        <h3 style="margin:0;">תפריט תזונה</h3>

          ${!nutritionPlan ? `<button class="btn small" id="createNutritionBtn">+ יצירת תפריט</button>` : `

            <button class="btn ghost small" id="editPlanBtn">✎ עריכת יעדים</button>

          <span class="badge" style="background:${l.calories_delta>0?'rgba(229,72,77,0.15)':'rgba(51,196,129,0.15)'};color:${l.calories_delta>0?'var(--red)':'var(--green)'};">${l.calories_delta>0?'+':''}${l.calories_delta} קק"ל</span>

            <button class="btn small" id="addDayBtn">+ הוספת יום</button>
            ${!program.week_pattern ? `<button class="btn ghost small" id="makeRecurringBtn">🔁 המשך אוטומטית לפי השבוע הזה</button>` : `
              <span class="badge" style="background:var(--blue-dim);color:var(--blue-bright);">🔁 ממשיך אוטומטית</span>
              <button class="btn ghost small" id="addWeekNowBtn">➕ הוספת שבוע נוסף עכשיו</button>
              <button class="btn ghost small" id="editRecurringBtn">✎ עריכת המחזור</button>
              <button class="btn ghost small" id="fixFutureDaysBtn" style="color:var(--red);border-color:var(--red);">🔄 תיקון ימים עתידיים</button>

      <div id="programArea" style="margin-top:14px;">
        ${program ? renderDaysList(program.program_days || [], program.start_date) : `<div class="empty">עדיין לא נוצרה תוכנית למתאמן זה</div>`}

    confirmDeleteTrainee(tid, trainee.full_name, renderCoachHome);
  };
  document.getElementById('editTraineeBtn').onclick = () => openEditTraineeModal(trainee);
  document.getElementById('toggleSuspendBtn').onclick = () => {
    const newVal = !trainee.is_suspended;
    const msg = newVal
      ? `להשהות זמנית את ${trainee.full_name}? הוא/היא לא יוכל/תוכל להתחבר לאפליקציה עד שתבטלי את ההשהיה.`
      : `לבטל את ההשהיה של ${trainee.full_name}?`;
    if(!confirm(msg)) return;
    rest('profiles', { method:'PATCH', query:`?id=eq.${trainee.id}`, body:{ is_suspended: newVal } })
      .then(() => { showToast(newVal ? 'המתאמן/ת הושהה' : 'ההשהיה בוטלה'); renderCoachTraineeDetail(); })
      .catch(e => showToast(e.message, true));
  };
  const boardBtn = document.getElementById('showBoardBtn');
  if(boardBtn) boardBtn.onclick = () => openAdherenceBoardModal(program, renderCoachTraineeDetail);
  if(!program){
    document.getElementById('createProgramBtn').onclick = () => openCreateProgramModal(tid);
  } else {
    document.getElementById('addDayBtn').onclick = () => openAddDayModal(program.id, program.start_date);
    const makeRecurringBtn = document.getElementById('makeRecurringBtn');
    if(makeRecurringBtn) makeRecurringBtn.onclick = () => openMakeRecurringModal(program);
    const addWeekNowBtn = document.getElementById('addWeekNowBtn');
    if(addWeekNowBtn) addWeekNowBtn.onclick = async () => {
      addWeekNowBtn.disabled = true; addWeekNowBtn.textContent = 'מוסיפה...';
      try{
        await extendProgramByOneWeek(program);
        showToast('שבוע נוסף התווסף לתוכנית');
        renderCoachTraineeDetail();
      }catch(e){
        showToast(e.message, true);
        addWeekNowBtn.disabled = false; addWeekNowBtn.textContent = '➕ הוספת שבוע נוסף עכשיו';
      }
    };
    const editRecurringBtn = document.getElementById('editRecurringBtn');
    if(editRecurringBtn) editRecurringBtn.onclick = () => openMakeRecurringModal(program, true);
    const fixFutureDaysBtn = document.getElementById('fixFutureDaysBtn');
    if(fixFutureDaysBtn) fixFutureDaysBtn.onclick = () => openFixFutureDaysModal(program);
    const removeRecurringBtn = document.getElementById('removeRecurringBtn');
    if(removeRecurringBtn) removeRecurringBtn.onclick = () => {
      if(!confirm('לבטל את ההמשך האוטומטי? הימים שכבר נבנו יישארו, אבל התוכנית תפסיק להתמלא לבד מעכשיו.')) return;
      rest('programs', { method:'PATCH', query:`?id=eq.${program.id}`, body:{ week_pattern: null, template_key: null } })
        .then(() => { showToast('ההמשך האוטומטי בוטל'); renderCoachTraineeDetail(); })
        .catch(e => showToast(e.message, true));
    };
    document.getElementById('deleteProgramBtn').onclick = () => {
      if(!confirm(`למחוק את כל התוכנית "${program.title}" כולל כל הימים והתרגילים? לא ניתן לשחזר. אחרי המחיקה תוכלי ליצור תוכנית חדשה.`)) return;
      rest('programs', { method:'DELETE', query:`?id=eq.${program.id}` })
        .then(() => { showToast('התוכנית נמחקה'); renderCoachTraineeDetail(); })
        .catch(e => showToast(e.message, true));
    };
  }
  if(!nutritionPlan){
    document.getElementById('createNutritionBtn').onclick = () => openCreateNutritionModal(tid);
  } else {
    document.getElementById('addMealBtn').onclick = () => openAddMealModal(nutritionPlan.id);
    document.getElementById('editPlanBtn').onclick = () => openCreateNutritionModal(tid, nutritionPlan);
    document.getElementById('deletePlanBtn').onclick = () => {
      if(!confirm(`למחוק את כל התפריט "${nutritionPlan.title}" כולל כל הארוחות? לא ניתן לשחזר.`)) return;
      rest('nutrition_plans', { method:'DELETE', query:`?id=eq.${nutritionPlan.id}` })
        .then(() => { showToast('התפריט נמחק'); renderCoachTraineeDetail(); })
        .catch(e => showToast(e.message, true));
    };
    document.querySelectorAll('[data-edit-meal]').forEach(btn => {
      btn.onclick = () => {
        const meal = mealsList.find(m => m.id === btn.getAttribute('data-edit-meal'));
        if(meal) openAddMealModal(nutritionPlan.id, meal);
      };
    });
    document.querySelectorAll('[data-delete-meal]').forEach(btn => {
      btn.onclick = () => {
        if(!confirm('למחוק את הארוחה הזו?')) return;
        rest('meals', { method:'DELETE', query:`?id=eq.${btn.getAttribute('data-delete-meal')}` })
          .then(() => { showToast('הארוחה נמחקה'); renderCoachTraineeDetail(); })
          .catch(e => showToast(e.message, true));
      };
    });

  document.querySelectorAll('[data-week-toggle-coach]').forEach(head => {
    head.onclick = () => {
      const folder = head.closest('.week-folder');
      if(folder) folder.classList.toggle('expanded');
    };
  });
  document.querySelectorAll('[data-manage-ex]').forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      const dayId = btn.getAttribute('data-manage-ex');
      const day = (program.program_days || []).find(d => d.id === dayId);
      if(day) openManageExercisesModal(day);
    };
  });
  document.querySelectorAll('[data-make-workout]').forEach(btn => {
    btn.onclick = async (ev) => {
      ev.stopPropagation();
      const dayId = btn.getAttribute('data-make-workout');
      const day = (program.program_days || []).find(d => d.id === dayId);
      if(!day) return;
      btn.disabled = true;
      try {
        const newTitle = (day.title && day.title !== 'מנוחה' && day.title !== 'יום מנוחה') ? day.title : 'אימון';
        await rest('program_days', { method:'PATCH', query:`?id=eq.${dayId}`, body:{ is_rest_day:false, title:newTitle }, prefer:'return=minimal' });
        day.is_rest_day = false;
        day.title = newTitle;
        openManageExercisesModal(day);
      } catch(e) {
        btn.disabled = false;
        alert('לא הצלחתי להפוך את היום לאימון: ' + (e.message || e));
      }
    };
  });
  document.querySelectorAll('[data-move-day]').forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      const dayId = btn.getAttribute('data-move-day');
      const currentNum = parseInt(btn.getAttribute('data-daynum'));
      openMoveDayModal(dayId, currentNum, program);
    };
  });
  document.querySelectorAll('[data-open-day]').forEach(row => {
    row.onclick = () => {
      const dayId = row.getAttribute('data-open-day');
      const day = (program.program_days || []).find(d => d.id === dayId);
      if(day && !day.is_rest_day) openManageExercisesModal(day);
    };
  });
  const exportBtn = document.getElementById('exportCoachBtn');
  if(exportBtn) exportBtn.onclick = () => exportCSV(`motion-progress-${trainee.full_name}.csv`,
    ['תאריך','משקל','חזה','מותן','ירכיים','זרוע','ירך','הערות'],
    progress.map(p => [new Date(p.entry_date).toLocaleDateString('he-IL'), p.weight_kg, p.chest_cm, p.waist_cm, p.hips_cm, p.arm_cm, p.thigh_cm, p.notes])
  );
  document.querySelectorAll('.photo-thumb').forEach(img => {
    img.onclick = () => {
      const lb = document.createElement('div');
      lb.className = 'lightbox-bg';
      lb.innerHTML = `<img src="${img.getAttribute('data-full')}">`;
      lb.onclick = () => lb.remove();
      document.body.appendChild(lb);
    };
  });
}

function renderDaysList(days, startDate){
  if(!days.length) return `<div class="empty">אין ימים בתוכנית עדיין</div>`;
  const sorted = days.slice().sort((a,b)=>a.day_number-b.day_number);
  const weekGroups = groupDaysByCalendarWeek(sorted, startDate);

  return weekGroups.map(({weekNum, isCurrentWeek, days: weekDays}) => {
    const startLbl = startDate ? dayLabel(startDate, weekDays[0].day_number) : null;
    const endLbl = startDate ? dayLabel(startDate, weekDays[weekDays.length-1].day_number) : null;
    const workDaysInWeek = weekDays.filter(d=>!d.is_rest_day);
    const doneInWeek = workDaysInWeek.filter(d=>d.completed).length;
    return `
    <div class="panel week-folder ${isCurrentWeek?'expanded':''}" style="margin-bottom:10px;padding:0;overflow:hidden;">
      <div class="week-folder-head" data-week-toggle-coach="${weekNum}">
        <div>
          <div class="week-folder-title">📁 שבוע ${weekNum}</div>
          <div class="week-folder-sub">${startLbl && endLbl ? `<span dir="ltr" style="unicode-bidi:isolate;">${startLbl.dateStr} - ${endLbl.dateStr}</span>` : ''}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;">
          ${workDaysInWeek.length ? `<span class="badge" style="background:${doneInWeek===workDaysInWeek.length?'rgba(51,196,129,0.18)':'var(--blue-dim)'};color:${doneInWeek===workDaysInWeek.length?'var(--green)':'var(--blue-bright)'};">${doneInWeek}/${workDaysInWeek.length}</span>` : ''}
          <span class="chevron week-chevron">▾</span>
        </div>
      </div>
      <div class="week-folder-body">
        ${weekDays.map(d => {
          const exCount = (d.exercises || []).length;
          const lbl = startDate ? dayLabel(startDate, d.day_number) : null;
          return `
          <div class="day-row ${d.completed?'done':''} ${d.is_rest_day?'rest':''}" data-open-day="${d.id}" style="cursor:${d.is_rest_day?'default':'pointer'};">
            <div class="day-num" style="min-width:64px;">${lbl ? `${lbl.weekday}<div style="font-size:10px;color:var(--muted);font-weight:600;">${lbl.dateStr}</div>` : `D${d.day_number}`}</div>
            <div class="day-info">
              <div class="t">${d.is_rest_day ? 'יום מנוחה' : `${exCount} תרגילים`}</div>
            </div>
            ${d.is_rest_day ? `<span class="badge">מנוחה</span><button class="btn ghost small" data-make-workout="${d.id}">➕ הפיכה לאימון</button>` : `<button class="btn ghost small" data-manage-ex="${d.id}">✎ תרגילים</button>`}
            ${d.trainee_note ? `<span class="badge" style="background:var(--blue-dim);color:var(--blue-bright);" title="${d.trainee_note.replace(/"/g,'&quot;')}">💬 הערה</span>` : ''}
            <button class="icon-btn" data-move-day="${d.id}" data-daynum="${d.day_number}" title="העברה ליום אחר">↕</button>
            ${d.completed ? `<span class="badge" style="background:#0F3D2A;color:var(--green);">בוצע</span>` : ''}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }).join('');
}

function openFixFutureDaysModal(program){
  const existingDays = (program.program_days || []).slice().sort((a,b)=>a.day_number-b.day_number);
  const maxBuilt = existingDays.length ? Math.max(...existingDays.map(d=>d.day_number)) : 0;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>🔄 תיקון ימים עתידיים</h3>
      <p class="muted" style="font-size:13px;line-height:1.6;">
        אם ערכת את המחזור השבועי (ימים 1-7) אחרי שכבר נבנו שבועות הבאים, השבועות הבאים עלולים להישאר עם הדפוס הישן. הפעולה הזו <b style="color:var(--red);">תמחק לצמיתות</b> את כל הימים מהמספר שתבחרי והלאה, ותיתן להם להיבנות מחדש אוטומטית לפי המחזור הנוכחי והמתוקן.
      </p>
      <div class="field">
        <label>למחוק ולבנות מחדש החל מיום מספר</label>
        <input id="fixFromNum" type="number" value="8" min="1" max="${maxBuilt}">
        <p class="muted" style="font-size:11.5px;margin-top:4px;">בד"כ כדאי להשאיר את השבוע הראשון (ימים 1-7) כמו שהוא, ולתקן רק מיום 8 והלאה.</p>
      </div>
      <div id="fixErr" class="error hidden"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="fixCancel">ביטול</button>
        <button class="btn danger full" id="fixConfirm">מחיקה ובנייה מחדש</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  document.getElementById('fixCancel').onclick = () => bg.remove();
  document.getElementById('fixConfirm').onclick = async () => {
    const errEl = document.getElementById('fixErr');
    const fromNum = parseInt(document.getElementById('fixFromNum').value);
    if(!fromNum || fromNum < 1){ errEl.textContent = 'נא להזין מספר יום תקין.'; errEl.classList.remove('hidden'); return; }
    const btn = document.getElementById('fixConfirm');
    btn.disabled = true; btn.textContent = 'מוחקת...';
    try{
      const toDelete = existingDays.filter(d => d.day_number >= fromNum);
      for(const d of toDelete){
        await rest('exercises', { method:'DELETE', query:`?day_id=eq.${d.id}` });
        await rest('program_days', { method:'DELETE', query:`?id=eq.${d.id}` });
      }
      program.program_days = existingDays.filter(d => d.day_number < fromNum);
      btn.textContent = 'בונה מחדש...';
      let currentMax = program.program_days.length ? Math.max(...program.program_days.map(d=>d.day_number)) : 0;
      let safety = 0;
      while(currentMax < maxBuilt && safety < 30){
        await extendProgramByOneWeek(program);
        const rows = await rest('program_days', { query:`?program_id=eq.${program.id}&select=*,exercises(*)&order=day_number.asc` }) || [];
        program.program_days = rows;
        const newMax = rows.length ? Math.max(...rows.map(d=>d.day_number)) : 0;
        if(newMax === currentMax) break; // בטיחות מפני לולאה אינסופית
        currentMax = newMax;
        safety++;
      }
      bg.remove();
      showToast('הימים העתידיים תוקנו ונבנו מחדש');
      renderCoachTraineeDetail();
    }catch(e){
      errEl.textContent = e.message;
      errEl.classList.remove('hidden');
      btn.disabled = false; btn.textContent = 'מחיקה ובנייה מחדש';
    }
  };
}

function pickWeekPatternSlot(week, program, dayNumber){
  // תבניות מותאמות אישית (שנבחרו לפי יום בשבוע ספציפי) חייבות תמיד להתיישר לפי יום השבוע האמיתי בלוח השנה,
  // אחרת "יום ג'" למשל עלול לנחות על יום אחר בשבועות הבאים אם תאריך ההתחלה לא היה יום ראשון.
  // תבניות מובנות (A/B/C וכו') ממשיכות ברצף רגיל, בלי תלות ביום בשבוע.
  if(program.template_key === 'custom'){
    const weekday = dayDate(program.start_date, dayNumber).getDay(); // 0=ראשון...6=שבת
    return week[weekday % week.length];
  }
  return week[(dayNumber-1) % week.length];
}

async function extendProgramByOneWeek(program){
  if(!program.week_pattern || !program.week_pattern.length) throw new Error('לתוכנית הזו אין מחזור שבועי שמור.');
  const week = program.week_pattern;
  const days = program.program_days || [];
  const existingMax = days.length ? Math.max(...days.map(d=>d.day_number)) : 0;
  const target = Math.min(program.duration_days, existingMax + 7);
  if(target <= existingMax) throw new Error('התוכנית כבר הגיעה לסוף המשך שלה.');
  for(let n=existingMax+1; n<=target; n++){
    const tpl = pickWeekPatternSlot(week, program, n);
    const created = await rest('program_days', { method:'POST', body:{
      program_id: program.id, day_number: n,
      title: tpl.title, description: tpl.description || '', is_rest_day: !!tpl.is_rest_day
    }, prefer:'return=representation' });
    const dayRow = created && created[0];
    if(dayRow && !tpl.is_rest_day && tpl.exercises && tpl.exercises.length){
      await rest('exercises', { method:'POST', body: tpl.exercises.map((ex,idx) => ({
        day_id: dayRow.id, order_index: idx, name: ex.name,
        target_sets: ex.sets || null, target_reps: ex.reps || null, target_weight_kg: ex.weight || null
      })) });
    }
  }
}

async function autoExtendProgramIfNeeded(program){
  if(!program || !program.week_pattern || !program.week_pattern.length) return program;
  const week = program.week_pattern;
  const days = program.program_days || [];
  const existingMax = days.length ? Math.max(...days.map(d=>d.day_number)) : 0;
  const daysSinceStart = Math.floor((Date.now() - new Date(program.start_date).getTime())/86400000) + 1;
  const target = Math.min(program.duration_days, Math.max(daysSinceStart + 7, 7)); // תמיד שומרת שבוע קדימה כמלאי
  if(target <= existingMax) return program;
  const newDays = [];
  for(let n=existingMax+1; n<=target; n++){
    const tpl = pickWeekPatternSlot(week, program, n);
    try{
      const created = await rest('program_days', { method:'POST', body:{
        program_id: program.id, day_number: n,
        title: tpl.title, description: tpl.description || '', is_rest_day: !!tpl.is_rest_day
      }, prefer:'return=representation' });
      const dayRow = created && created[0];
      if(!dayRow) continue;
      let exercisesForDay = [];
      if(!tpl.is_rest_day && tpl.exercises && tpl.exercises.length){
        const exBody = tpl.exercises.map((ex,idx) => ({
          day_id: dayRow.id, order_index: idx, name: ex.name,
          target_sets: ex.sets || null, target_reps: ex.reps || null, target_weight_kg: ex.weight || null
        }));
        const createdEx = await rest('exercises', { method:'POST', body: exBody, prefer:'return=representation' });
        exercisesForDay = createdEx || [];
      }
      newDays.push({ ...dayRow, exercises: exercisesForDay });
    }catch(e){ break; } // אם משהו נכשל, לא נעצור את טעינת האפליקציה - פשוט נמשיך עם מה שיש
  }
  program.program_days = days.concat(newDays);
  return program;
}

          const tid = sel.value;
          if(!tid) return { title:'מנוחה', is_rest_day:true };
          if(tid === '__cardio__') return { title:'אימון אירובי', is_rest_day:false, exercises:[{ name:'הליכה מהירה / קרדיו', sets:1, reps:'30 דקות' }] };
          const tpl = savedTemplates.find(t => t.id === tid);
          return {
            title: tpl.title || tpl.name, description: tpl.description || '', is_rest_day:false,
            exercises: (tpl.exercises||[]).map(e => ({ name:e.name, sets:e.target_sets, reps:e.target_reps, weight:e.target_weight_kg }))
          };
        });
        if(week.every(d => d.is_rest_day)){
          errEl.textContent = 'בחרי לפחות תבנית אחת ליום כלשהו בשבוע.';
          errEl.classList.remove('hidden');
          saveBtn.disabled = false; saveBtn.textContent = 'יצירה';
          return;
        }
      } else if(selectedTemplate && PROGRAM_TEMPLATES[selectedTemplate]){
        week = PROGRAM_TEMPLATES[selectedTemplate].week;
      }

      const program = await rest('programs', { method:'POST', body:{
        trainee_id: traineeId, coach_id: PROFILE.id,
        title: document.getElementById('pTitle').value.trim() || 'תוכנית 90 יום',
        start_date: document.getElementById('pStart').value,
        duration_days: duration,
        template_key: selectedTemplate || null,
        week_pattern: week
      }, prefer:'return=representation' });
      const newProgram = program && program[0];
      if(newProgram && week){
        const fillDays = Math.min(duration, parseInt(document.getElementById('pFillDays').value) || 7);
        for(let i=0;i<fillDays;i++){
          const tpl = pickWeekPatternSlot(week, newProgram, i+1);
          saveBtn.textContent = `יוצרת יום ${i+1}/${fillDays}...`;
          const createdDay = await rest('program_days', { method:'POST', body:{
            program_id: newProgram.id, day_number: i+1,
            title: tpl.title, description: tpl.description || '', is_rest_day: !!tpl.is_rest_day
          }, prefer:'return=representation' });
          const dayRow = createdDay && createdDay[0];
          if(dayRow && !tpl.is_rest_day && tpl.exercises && tpl.exercises.length){
            await rest('exercises', { method:'POST', body: tpl.exercises.map((ex,idx) => ({
              day_id: dayRow.id, order_index: idx, name: ex.name,
              target_sets: ex.sets || null, target_reps: ex.reps || null, target_weight_kg: ex.weight || null
            })) });
          }
        }
      }
      bg.remove();
      showToast('התוכנית נוצרה עם כל התרגילים - אפשר להוסיף עוד ימים בכל שלב');
      renderCoachTraineeDetail();
    }catch(e){
      errEl.textContent = e.message;
      errEl.classList.remove('hidden');
      saveBtn.disabled = false; saveBtn.textContent = 'יצירה';
    }
  };
}

          <button type="button" class="add-exercise-link" id="mAddExRow" style="flex:1;">+ הוספת תרגיל</button>

    document.getElementById('mTitle').value = tpl.title || tpl.name;

      }
      const toCreate = rows.filter(r => !r.id && r.name && r.name.trim());
      const toUpdate = rows.filter(r => r.id && r.name && r.name.trim());

          target_sets: r.sets ? parseInt(r.sets) : null,

      errEl.classList.remove('hidden');

    }
  };
}

          name, calories: num('mCal'), protein_g: num('mProt'), carbs_g: num('mCarb'), fat_g: num('mFat'),
          description: document.getElementById('mDesc').value.trim()
        }});
      } else {
        const existing = await rest('meals', { query:`?plan_id=eq.${planId}&select=order_index` }) || [];
        const nextIndex = existing.length ? Math.max(...existing.map(m=>m.order_index||0)) + 1 : 0;
        await rest('meals', { method:'POST', body:{
          plan_id: planId, order_index: nextIndex,
          name, calories: num('mCal'), protein_g: num('mProt'), carbs_g: num('mCarb'), fat_g: num('mFat'),
          description: document.getElementById('mDesc').value.trim()
        }});
      }
      bg.remove();
      showToast(existingMeal ? 'הארוחה עודכנה' : 'הארוחה נוספה');
      renderCoachTraineeDetail();
    }catch(e){
      errEl.textContent = e.message;
      errEl.classList.remove('hidden');
    }
  };
}

      PROFILE.fitness_goal = text;
      showToast('המטרה נשמרה 🎯');
      renderTraineeDashboard();
    }catch(e){ showToast(e.message, true); }
  };
  const editGoalBtn = document.getElementById('editGoalStatementBtn');
  if(editGoalBtn) editGoalBtn.onclick = async () => {
    try{
      await rest('profiles', { method:'PATCH', query:`?id=eq.${PROFILE.id}`, body:{ fitness_goal: null } });
      PROFILE.fitness_goal = null;
      renderTraineeDashboard();
    }catch(e){ showToast(e.message, true); }
  };
  const dashLogBtn = document.getElementById('dashLogBtn');
  if(dashLogBtn) dashLogBtn.onclick = () => openLogProgressModal();
  const dashTodayBtn = document.getElementById('dashTodayBtn');
  if(dashTodayBtn) dashTodayBtn.onclick = async () => {

  };
  const dashNutritionBtn = document.getElementById('dashNutritionBtn');

  maybeShowWelcome();

              ${workDaysInWeek.length ? `<span class="badge" style="background:${doneInWeek===workDaysInWeek.length?'rgba(51,196,129,0.18)':'var(--blue-dim)'};color:${doneInWeek===workDaysInWeek.length?'var(--green)':'var(--blue-bright)'};">${doneInWeek}/${workDaysInWeek.length}</span>` : ''}
              ${hasIncompletePast ? `<span title="יש אימונים שהוחמצו השבוע" style="color:var(--red);">⚠</span>` : ''}
              <span class="chevron week-chevron">▾</span>
            </div>
          </div>
          <div class="week-folder-body">
            ${weekDays.map(d => renderTraineeDayCardHtml(d, program, days, todaysDay)).join('')}
          </div>
        </div>`;
      }).join('');
    })()}
  `;

  const reminderBtn = document.getElementById('reminderLogBtn');
  if(reminderBtn) reminderBtn.onclick = renderTraineeProgress;
  const myBoardBtn = document.getElementById('myBoardBtn');
  if(myBoardBtn) myBoardBtn.onclick = () => openAdherenceBoardModal(program, renderTraineeHome);
  const addCardioBtn = document.getElementById('addCardioBtn');
  if(addCardioBtn) addCardioBtn.onclick = () => openAddCardioModal(program, days);
  const todayBtn = document.getElementById('todayWorkoutBtn');
  if(todayBtn && todaysDay){
    todayBtn.onclick = () => {
      const card = document.querySelector(`[data-daycard="${todaysDay.id}"]`);
      if(card){
        const folder = card.closest('.week-folder');
        if(folder) folder.classList.add('expanded');
        card.classList.add('expanded');
        card.scrollIntoView({ behavior:'smooth', block:'center' });
        card.style.outline = '2px solid var(--blue-bright)';
        setTimeout(()=>{ card.style.outline = ''; }, 2000);
      }
    };
  }

  document.querySelectorAll('[data-toggle]').forEach(head => {
    head.onclick = () => {
      const card = document.querySelector(`[data-daycard="${head.getAttribute('data-toggle')}"]`);
      if(card && card.querySelector('.day-card-body')) card.classList.toggle('expanded');
    };
  });

  document.querySelectorAll('[data-week-toggle]').forEach(head => {
    head.onclick = () => {
      const folder = head.closest('.week-folder');
      if(folder) folder.classList.toggle('expanded');
    };
  });

  // החלקה (swipe) על כרטיס יום במובייל = סימון/ביטול סימון כבוצע, בלי לפתוח את הכרטיס
  document.querySelectorAll('.day-card:not(.rest)').forEach(card => {
    let startX = null, startY = null, dragging = false;
    card.addEventListener('touchstart', (ev) => {
      startX = ev.touches[0].clientX; startY = ev.touches[0].clientY; dragging = true;
    }, { passive:true });
    card.addEventListener('touchmove', (ev) => {
      if(!dragging || startX===null) return;
      const dx = ev.touches[0].clientX - startX;
      const dy = ev.touches[0].clientY - startY;
      if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 15){
        card.style.transform = `translateX(${dx*0.3}px)`;
      }
    }, { passive:true });
    card.addEventListener('touchend', (ev) => {
      card.style.transform = '';
      if(!dragging || startX===null) return;
      const dx = (ev.changedTouches[0].clientX - startX);
      const dy = (ev.changedTouches[0].clientY - startY);
      dragging = false; startX = null;
      if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)){
        const cb = card.querySelector('.day-check');
        if(cb && !cb.disabled){ cb.checked = !cb.checked; cb.dispatchEvent(new Event('change')); }
      }
    });
  });

  document.querySelectorAll('[data-trainee-move]').forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      const dayId = btn.getAttribute('data-trainee-move');
      const currentNum = parseInt(btn.getAttribute('data-daynum'));
      openMoveDayModal(dayId, currentNum, program, renderTraineeHome);
    };
  });

  document.querySelectorAll('[data-self-manage-ex]').forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      const dayId = btn.getAttribute('data-self-manage-ex');
      const day = days.find(d => d.id === dayId);
      if(day) openManageExercisesModal(day, renderTraineeHome);
    };
  });

  document.querySelectorAll('[data-history]').forEach(el => {
    el.onclick = (ev) => {
      ev.stopPropagation();
      openExerciseHistoryModal(el.getAttribute('data-history'), days, program ? program.start_date : null);
    };
  });

  document.querySelectorAll('[data-instr]').forEach(el => {
    el.onclick = (ev) => {
      ev.stopPropagation();
      const instr = findLibraryInstructions(el.getAttribute('data-instr'));
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal"><h3>${el.getAttribute('data-instr')}</h3><p style="font-size:13px;color:var(--muted);line-height:1.7;">${instr}</p><div class="modal-actions"><button class="btn full" id="instrClose">סגירה</button></div></div>`;
      document.body.appendChild(bg);
      document.getElementById('instrClose').onclick = () => bg.remove();
      bg.onclick = (e2) => { if(e2.target === bg) bg.remove(); };
    };
  });

  document.querySelectorAll('.note-save-btn').forEach(btn => {
    btn.onclick = async (ev) => {
      ev.stopPropagation();
      const dayId = btn.getAttribute('data-noteday');
      const textarea = document.querySelector(`.trainee-note-input[data-noteday="${dayId}"]`);
      try{
        await rest('program_days', { method:'PATCH', query:`?id=eq.${dayId}`, body:{ trainee_note: textarea.value.trim() } });
        showToast('ההערה נשמרה - המאמן/ת יראה אותה');
      }catch(e){ showToast(e.message, true); }
    };
  });

  document.querySelectorAll('[data-watch]').forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      openVideoModal(btn.getAttribute('data-watch'));
    };
  });

  document.querySelectorAll('[data-open-playlist]').forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      openPlaylistModal(btn.getAttribute('data-open-playlist'));
    };
  });

  document.querySelectorAll('[data-swap-ex]').forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      const exId = btn.getAttribute('data-swap-ex');
      const currentName = btn.getAttribute('data-ex-name');
      const category = findLibraryCategory(currentName);
      openLibraryPicker(async (item) => {
        try{
          await rest('exercises', { method:'PATCH', query:`?id=eq.${exId}`, body:{
            name: item.name,
            actual_sets: null, actual_reps: null, actual_weight_kg: null, completed: false, video_url: null
          }});
          showToast(`הוחלף ל-"${item.name}"`);
          renderTraineeHome();
        }catch(e){ showToast(e.message, true); }
      }, category || '', `החלפת "${currentName}" בתרגיל אחר${category ? ' (' + category + ')' : ''}`);
    };
  });

  document.querySelectorAll('[data-samelast]').forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      const item = btn.closest('.exercise-item');
      item.querySelector('.ex-sets').value = btn.getAttribute('data-sets') || '';
      item.querySelector('.ex-reps').value = btn.getAttribute('data-reps') || '';
      item.querySelector('.ex-weight').value = btn.getAttribute('data-weight') || '';
    };
  });

  document.querySelectorAll('[data-complete-all]').forEach(btn => {
    btn.onclick = async (ev) => {
      ev.stopPropagation();
      const dayId = btn.getAttribute('data-complete-all');
      const day = days.find(d => d.id === dayId);
      if(!day) return;
      btn.disabled = true; btn.textContent = 'מסמנת...';
      try{
        for(const ex of (day.exercises || [])){
          await rest('exercises', { method:'PATCH', query:`?id=eq.${ex.id}`, body:{
            actual_sets: ex.actual_sets ?? ex.target_sets ?? null,
            actual_reps: ex.actual_reps ?? ex.target_reps ?? null,
            actual_weight_kg: ex.actual_weight_kg ?? ex.target_weight_kg ?? null,
            completed: true
          }});
        }
        await rest('program_days', { method:'PATCH', query:`?id=eq.${dayId}`, body:{ completed: true, completed_at: new Date().toISOString() } });
        showToast(randomMotivation());
        renderTraineeHome();
      }catch(e){ showToast(e.message, true); btn.disabled = false; btn.textContent = '✅ סיימתי את כל התרגילים'; }
    };
  });

  document.querySelectorAll('.exercise-item').forEach(item => {
    item.querySelectorAll('.stepper-btn').forEach(btn => {
      btn.onclick = (ev) => {
        ev.stopPropagation();
        const field = btn.getAttribute('data-step-field');
        const amt = parseFloat(btn.getAttribute('data-step-amt'));
        const input = item.querySelector(field === 'sets' ? '.ex-sets' : field === 'reps' ? '.ex-reps' : '.ex-weight');
        const current = parseFloat(input.value);
        const base = isNaN(current) ? 0 : current;
        const next = Math.max(0, base + amt);
        input.value = field === 'weight' ? (Math.round(next*100)/100) : Math.round(next);
      };
    });
    const saveBtn = item.querySelector('.ex-save');
    saveBtn.onclick = async (ev) => {
      ev.stopPropagation();
      const exId = item.getAttribute('data-exid');
      const exName = item.getAttribute('data-exname');
      const dayNum = parseInt(item.getAttribute('data-daynum'));
      const sets = item.querySelector('.ex-sets').value;
      const reps = item.querySelector('.ex-reps').value;
      const weight = item.querySelector('.ex-weight').value;
      const newWeight = weight===''?null:parseFloat(weight);
      try{
        const prevMax = newWeight!=null ? findMaxLoggedWeight(exName, days, dayNum) : null;
        const isPR = newWeight!=null && prevMax!=null && newWeight > prevMax;
        await rest('exercises', { method:'PATCH', query:`?id=eq.${exId}`, body:{
          actual_sets: sets===''?null:parseInt(sets),
          actual_reps: reps===''?null:reps,
          actual_weight_kg: newWeight,
          completed: true
        }});
        item.classList.add('ex-done');
        saveBtn.textContent = '✓ עודכן';
        playDingSound();
        if(isPR){
          item.style.outline = '2px solid gold';
          showToast(`🏆 שיא אישי חדש! ${newWeight} ק"ג`);
          fireConfetti(true);
        } else {
          showToast('התרגיל נשמר');
        }
        startRestTimer(90);
      }catch(e){ showToast(e.message, true); }
    };
  });

  document.querySelectorAll('.day-check').forEach(cb => {
    cb.onchange = async () => {
      try{
        const dayId = cb.getAttribute('data-dayid');
        await rest('program_days', {
          method:'PATCH',
          query:`?id=eq.${dayId}`,
          body:{ completed: cb.checked, completed_at: cb.checked ? new Date().toISOString() : null }
        });
        showToast(cb.checked ? randomMotivation() : 'הסימון בוטל');
        const container = cb.closest('.day-card') || cb.closest('.day-row');
        if(container) container.classList.toggle('done', cb.checked);
        if(cb.checked){
          const thisDay = days.find(d => d.id === dayId);
          if(thisDay && program){
            const thisDate = dayDate(program.start_date, thisDay.day_number); thisDate.setHours(0,0,0,0);
            const thisSunday = new Date(thisDate); thisSunday.setDate(thisSunday.getDate() - thisSunday.getDay());
            const weekDays = days.filter(d => {
              if(d.is_rest_day) return false;
              const dd = dayDate(program.start_date, d.day_number); dd.setHours(0,0,0,0);
              const dSunday = new Date(dd); dSunday.setDate(dSunday.getDate() - dSunday.getDay());
              return dSunday.getTime() === thisSunday.getTime();
            });
            const weekDone = weekDays.every(d => d.id === dayId ? true : d.completed);
            fireConfetti(weekDone && weekDays.length > 1);
          } else {
            fireConfetti(false);
          }
        }
      }catch(e){ showToast(e.message, true); cb.checked = !cb.checked; }
    };
  });
  removeTimerFab();
  renderTimerFab();
  renderPlaylistFab();
  maybeShowWelcome();
}

async function renderTraineeNutrition(){
  const app = document.getElementById('app');
  app.innerHTML = appShell(
    [{key:'home', label:'🏠 בית'}, {key:'program', label:'📋 התוכנית שלי'}, {key:'nutrition', label:'🍽 התפריט שלי'}, {key:'progress', label:'📈 ההתקדמות שלי'}],
    'nutrition',
    `<div class="skeleton skel-block"></div><div class="skeleton skel-row"></div><div class="skeleton skel-row"></div>`
  );
  bindShellNav({ home: renderTraineeDashboard, program: renderTraineeHome, nutrition: renderTraineeNutrition, progress: renderTraineeProgress });

  let plans = [];
  let logs = [];
  let foodEntries = [];
  try{
    plans = await rest('nutrition_plans', { query:`?trainee_id=eq.${PROFILE.id}&select=*,meals(*)&order=created_at.desc` }) || [];
  }catch(e){ showToast(e.message, true); }
  try{
    logs = await rest('nutrition_logs', { query:`?trainee_id=eq.${PROFILE.id}&select=*&order=log_date.desc` }) || [];
  }catch(e){}
  const todayStr = new Date().toISOString().slice(0,10);
  try{
    foodEntries = await rest('food_entries', { query:`?trainee_id=eq.${PROFILE.id}&log_date=eq.${todayStr}&select=*&order=created_at.asc` }) || [];
  }catch(e){}

  const plan = plans[0] || null;
  const meals = plan ? (plan.meals || []).slice().sort((a,b)=>a.order_index-b.order_index) : [];

  const foodTotals = foodEntries.reduce((acc,f) => {
    acc.calories += f.calories||0; acc.protein += f.protein_g||0; acc.carbs += f.carbs_g||0; acc.fat += f.fat_g||0;
    return acc;
  }, {calories:0, protein:0, carbs:0, fat:0});
  const calTarget = plan ? plan.daily_calories : null;
  const calRemaining = calTarget!=null ? calTarget - foodTotals.calories : null;
  const calPct = calTarget ? Math.min(100, Math.round(100*foodTotals.calories/calTarget)) : 0;

  const weekAgo = new Date(); weekAgo.setDate(weekAgo.getDate()-7);
  const weekLogs = logs.filter(l => new Date(l.log_date) >= weekAgo);
  const weekTotal = weekLogs.reduce((sum,l) => sum + (l.calories_delta||0), 0);

  document.querySelector('.main').innerHTML = `
    <h2 class="page-title">${plan ? plan.title : 'התפריט שלי'}</h2>
    <p class="page-sub">${plan ? 'תפריט התזונה שהמאמן שלך בנה עבורך' : 'המאמן שלך עדיין לא בנה עבורך תפריט'}</p>

    <div class="panel" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0;">🍎 מחשבון קלוריות - היום</h3>
        <button class="btn small" id="addFoodBtn">+ הוספת מאכל</button>
      </div>
      ${calTarget!=null ? `
        <div style="margin-top:14px;">
          <div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;">
            <span class="muted">${foodTotals.calories} / ${calTarget} קק"ל</span>
            <span style="color:${calRemaining<0?'var(--red)':'var(--green)'};font-weight:700;">${calRemaining<0?`${Math.abs(calRemaining)} קק"ל מעבר ליעד`:`נשארו ${calRemaining} קק"ל`}</span>
          </div>
          <div style="background:var(--bg-elevated);border-radius:20px;height:10px;overflow:hidden;">
            <div style="background:${calPct>=100?'var(--red)':'var(--blue)'};height:100%;width:${calPct}%;transition:width .3s ease;"></div>
          </div>
        </div>
        <div class="macro-grid" style="margin-top:14px;">
          <div class="macro-box"><div class="v">${foodTotals.protein}${plan.daily_protein_g?`/${plan.daily_protein_g}`:''}</div><div class="l">חלבון</div></div>
          <div class="macro-box"><div class="v">${foodTotals.carbs}${plan.daily_carbs_g?`/${plan.daily_carbs_g}`:''}</div><div class="l">פחמימות</div></div>
          <div class="macro-box"><div class="v">${foodTotals.fat}${plan.daily_fat_g?`/${plan.daily_fat_g}`:''}</div><div class="l">שומן</div></div>
          <div class="macro-box"><div class="v">${foodEntries.length}</div><div class="l">פריטים נרשמו</div></div>
        </div>
      ` : `<p class="muted" style="font-size:13px;margin-top:10px;">סה"כ היום: <b style="color:var(--white);">${foodTotals.calories} קק"ל</b> (${foodEntries.length} פריטים) - עדיין אין יעד קלורי מוגדר מהמאמן/ת</p>`}
      <div style="margin-top:14px;">
        ${foodEntries.length ? foodEntries.map(f => `
          <div class="day-row" style="cursor:default;">
            <div class="day-info">
              <div class="t">${f.name}</div>
              <div class="d">${[f.calories?`${f.calories} קק"ל`:null, f.protein_g?`${f.protein_g}g חלבון`:null, f.carbs_g?`${f.carbs_g}g פחמ׳`:null, f.fat_g?`${f.fat_g}g שומן`:null].filter(Boolean).join(' · ')}</div>
            </div>
            <button class="icon-btn" data-delete-food="${f.id}" style="width:30px;height:30px;">✕</button>
          </div>`).join('') : `<div class="empty" style="padding:16px;">עדיין לא נרשם כלום היום</div>`}
      </div>
    </div>
    ${plan ? `
      <div class="macro-grid" style="margin-bottom:18px;">
        <div class="macro-box"><div class="v">${plan.daily_calories ?? '—'}</div><div class="l">קלוריות ליום</div></div>
        <div class="macro-box"><div class="v">${plan.daily_protein_g ?? '—'}</div><div class="l">חלבון (גרם)</div></div>
        <div class="macro-box"><div class="v">${plan.daily_carbs_g ?? '—'}</div><div class="l">פחמימות (גרם)</div></div>
        <div class="macro-box"><div class="v">${plan.daily_fat_g ?? '—'}</div><div class="l">שומן (גרם)</div></div>
      </div>
      ${plan.general_notes ? `<div class="panel" style="margin-bottom:16px;"><h3>הערות כלליות</h3><div style="font-size:13px;color:var(--muted);white-space:pre-wrap;">${plan.general_notes}</div></div>` : ''}

            </div>
            ${m.description ? `<div class="meal-desc">${m.description}</div>` : ''}
          </div>`).join('') : `<div class="empty">עדיין לא נוספו ארוחות לתפריט</div>`}
      </div>
    ` : `<div class="panel" style="margin-bottom:16px;"><div class="empty">${logoSVG(46)}<div>המאמן שלך יבנה עבורך תפריט תזונה בקרוב</div></div></div>`}

    <div class="panel">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0;">יומן חריגות מהתפריט</h3>
        <button class="btn small" id="addDeviationBtn">+ דיווח חריגה</button>
      </div>
      <p class="muted" style="font-size:12px;margin:8px 0 0 0;">לא הספקת לאכול משהו מהתפריט, או אכלת משהו אחר במקום? דווחי כאן כדי לשמור על תמונה מדויקת מול המאמן/ת שלך.</p>
      ${weekLogs.length ? `
        <div style="margin-top:14px;padding:12px 14px;background:var(--bg-elevated);border-radius:10px;border:1px solid var(--border);">
          <div style="font-size:12px;color:var(--muted);">סה"כ השבוע (${weekLogs.length} דיווחים)</div>
          <div style="font-family:var(--font-mono);font-size:20px;font-weight:800;color:${weekTotal>0?'var(--red)':weekTotal<0?'var(--green)':'var(--white)'};">${weekTotal>0?'+':''}${weekTotal} קק"ל</div>
        </div>` : ''}
      <div style="margin-top:14px;">
        ${logs.length ? logs.slice(0,10).map(l => `
          <div class="day-row" style="cursor:default;">
            <div class="day-num" style="min-width:60px;font-size:11px;">${new Date(l.log_date).toLocaleDateString('he-IL',{day:'2-digit',month:'2-digit'})}</div>
            <div class="day-info"><div class="t">${l.description}</div></div>
            <span class="badge" style="background:${l.calories_delta>0?'rgba(229,72,77,0.15)':'rgba(51,196,129,0.15)'};color:${l.calories_delta>0?'var(--red)':'var(--green)'};">${l.calories_delta>0?'+':''}${l.calories_delta} קק"ל</span>
            <button class="icon-btn" data-delete-log="${l.id}" style="width:30px;height:30px;">✕</button>

  document.getElementById('addFoodBtn').onclick = () => openAddFoodModal();
  document.querySelectorAll('[data-delete-food]').forEach(btn => {

      rest('food_entries', { method:'DELETE', query:`?id=eq.${btn.getAttribute('data-delete-food')}` })
        .then(() => { showToast('הפריט נמחק'); renderTraineeNutrition(); })
        .catch(e => showToast(e.message, true));
    };
  });
  document.getElementById('addDeviationBtn').onclick = () => openAddDeviationModal();
  document.querySelectorAll('[data-delete-log]').forEach(btn => {
    btn.onclick = () => {
      rest('nutrition_logs', { method:'DELETE', query:`?id=eq.${btn.getAttribute('data-delete-log')}` })
        .then(() => { showToast('הדיווח נמחק'); renderTraineeNutrition(); })
