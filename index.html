function openAddFoodModal(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>+ הוספת מאכל</h3>
      <div class="field">
        <label>חיפוש בספרייה (אופציונלי - ממלא אוטומטית)</label>
        <input id="foodSearch" placeholder="לדוגמה: חזה עוף, אורז, ביצה...">
        <div id="foodSearchResults" style="max-height:160px;overflow-y:auto;margin-top:6px;"></div>
      </div>
      <div class="field hidden" id="foodGramsField">
        <label>כמות (גרם)</label>
        <input id="foodGrams" type="number" value="100">
      </div>
      <div class="field"><label>מה אכלת?</label><input id="foodName" placeholder="לדוגמה: חזה עוף עם אורז"></div>
      <div class="grid cols-2">
        <div class="field"><label>קלוריות</label><input id="foodCal" type="number" placeholder="לדוגמה: 350"></div>
        <div class="field"><label>חלבון (גרם, אופציונלי)</label><input id="foodProt" type="number"></div>
        <div class="field"><label>פחמימות (גרם, אופציונלי)</label><input id="foodCarb" type="number"></div>
        <div class="field"><label>שומן (גרם, אופציונלי)</label><input id="foodFat" type="number"></div>
      </div>
      <div id="foodErr" class="error hidden"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="foodCancel">ביטול</button>
        <button class="btn full" id="foodSave">הוספה</button>
      </div>
    </div>`;
  document.body.appendChild(bg);

  let selectedFood = null;
  function recalcFromLibrary(){
    if(!selectedFood) return;
    const grams = parseFloat(document.getElementById('foodGrams').value) || 0;
    const factor = grams / 100;
    document.getElementById('foodCal').value = Math.round(selectedFood.calories_per_100g * factor);
    document.getElementById('foodProt').value = selectedFood.protein_per_100g!=null ? Math.round(selectedFood.protein_per_100g * factor) : '';
    document.getElementById('foodCarb').value = selectedFood.carbs_per_100g!=null ? Math.round(selectedFood.carbs_per_100g * factor) : '';
    document.getElementById('foodFat').value = selectedFood.fat_per_100g!=null ? Math.round(selectedFood.fat_per_100g * factor) : '';
  }

  document.getElementById('foodSearch').oninput = async (ev) => {
    const q = ev.target.value.trim().toLowerCase();
    const resultsEl = document.getElementById('foodSearchResults');
    if(!q){ resultsEl.innerHTML = ''; return; }
    const lib = await getFoodLibrary();
    const filtered = lib.filter(f => f.name.toLowerCase().includes(q)).slice(0,8);
    resultsEl.innerHTML = filtered.map(f => `<div class="lib-item" data-pick-food="${f.id}"><div class="lib-name">${f.name}</div><div class="lib-cat">${f.calories_per_100g} קק"ל ל-100 גר׳${f.category ? ' · '+f.category : ''}</div></div>`).join('') || `<div class="empty" style="padding:12px;font-size:12px;">אין תוצאות</div>`;
    resultsEl.querySelectorAll('[data-pick-food]').forEach(el => {
      el.onclick = () => {
        selectedFood = filtered.find(f => f.id === el.getAttribute('data-pick-food'));
        document.getElementById('foodName').value = selectedFood.name;
        document.getElementById('foodGramsField').classList.remove('hidden');
        document.getElementById('foodGrams').value = 100;
        recalcFromLibrary();
        resultsEl.innerHTML = '';
        document.getElementById('foodSearch').value = selectedFood.name;
      };
    });
  };
  document.getElementById('foodGrams').oninput = recalcFromLibrary;

  document.getElementById('foodCancel').onclick = () => bg.remove();
  document.getElementById('foodSave').onclick = async () => {
    const errEl = document.getElementById('foodErr');
    const name = document.getElementById('foodName').value.trim();
    if(!name){ errEl.textContent = 'נא לרשום מה אכלת.'; errEl.classList.remove('hidden'); return; }
    const num = id => { const v = document.getElementById(id).value; return v===''?null:parseInt(v); };
    try{
      await rest('food_entries', { method:'POST', body:{
        trainee_id: PROFILE.id,
        log_date: new Date().toISOString().slice(0,10),
        name, calories: num('foodCal'), protein_g: num('foodProt'), carbs_g: num('foodCarb'), fat_g: num('foodFat')
      }});
      bg.remove();
      showToast('נוסף ליומן');
      renderTraineeNutrition();
    }catch(e){
      errEl.textContent = e.message;
      errEl.classList.remove('hidden');
    }
  };
}

      </div>

    ${badges.length ? `
    <div class="panel" style="margin-bottom:16px;">
      <h3>הישגים</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${badges.map(b => `<div class="streak-badge" style="background:var(--bg-elevated);color:var(--white);border:1px solid var(--border);">${b.icon} ${b.label}</div>`).join('')}
      </div>
    </div>` : ''}

    ${(firstPhoto && lastPhoto && firstPhoto.id !== lastPhoto.id) ? `
    <div class="panel" style="margin-bottom:16px;">
      <h3>לפני / אחרי</h3>
      <div class="grid cols-2">

          <img src="${firstPhoto.photo_url}" style="width:100%;border-radius:10px;border:1px solid var(--border);">

          <div class="muted" style="font-size:12px;margin-top:6px;text-align:center;">${new Date(lastPhoto.entry_date).toLocaleDateString('he-IL')}${lastPhoto.weight_kg?` · ${lastPhoto.weight_kg} ק"ג`:''}</div>
        </div>
      </div>
    </div>` : ''}

  document.getElementById('measureSelect').onchange = (ev) => {

    );
  };
  document.querySelectorAll('.photo-thumb').forEach(img => {

      lb.innerHTML = `<img src="${img.getAttribute('data-full')}">`;

    };

function openAddCardioModal(program, days){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>🏃 הוספת אימון אירובי</h3>
      <p class="muted" style="font-size:12px;margin-top:-8px;">אימון אירובי שעשית בנוסף לתוכנית - ריצה, הליכה, אופניים וכו'</p>
      <div class="field"><label>תאריך</label><input id="cardioDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="field"><label>סוג פעילות</label><input id="cardioType" placeholder="לדוגמה: ריצה, הליכה, אופניים, שחייה"></div>
      <div class="field"><label>משך (דקות)</label><input id="cardioDuration" type="number" placeholder="לדוגמה: 30"></div>
      <div class="field"><label>הערות (אופציונלי)</label><textarea id="cardioNotes" rows="2"></textarea></div>
      <div id="cardioErr" class="error hidden"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="cardioCancel">ביטול</button>
        <button class="btn full" id="cardioSave">שמירה</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  document.getElementById('cardioCancel').onclick = () => bg.remove();
  document.getElementById('cardioSave').onclick = async () => {
    const errEl = document.getElementById('cardioErr');
    const dateStr = document.getElementById('cardioDate').value;
    const type = document.getElementById('cardioType').value.trim() || 'אירובי';
    const duration = document.getElementById('cardioDuration').value;
    if(!dateStr){ errEl.textContent = 'נא לבחור תאריך.'; errEl.classList.remove('hidden'); return; }
    const saveBtn = document.getElementById('cardioSave');
    saveBtn.disabled = true; saveBtn.textContent = 'שומרת...';
    try{
      const selectedDate = new Date(dateStr);
      const dayNumber = Math.floor((selectedDate.getTime() - new Date(program.start_date).getTime())/86400000) + 1;
      let existingDay = days.find(d => d.day_number === dayNumber);
      let dayId;
      if(existingDay){
        dayId = existingDay.id;
        if(existingDay.is_rest_day){
          await rest('program_days', { method:'PATCH', query:`?id=eq.${dayId}`, body:{ is_rest_day: false } });
        }
      } else {
        const created = await rest('program_days', { method:'POST', body:{
          program_id: program.id, day_number: dayNumber,
          title: type, description: document.getElementById('cardioNotes').value.trim(), is_rest_day: false
        }, prefer:'return=representation' });
        dayId = created && created[0] && created[0].id;
      }
      if(!dayId) throw new Error('יצירת היום נכשלה.');
      await rest('exercises', { method:'POST', body:{
        day_id: dayId, order_index: 999, name: type,
        target_reps: duration ? `${duration} דקות` : null,
        actual_reps: duration ? `${duration} דקות` : null,
        completed: true
      }});
      bg.remove();
      showToast('האימון האירובי נשמר 🏃');
      renderTraineeHome();
    }catch(e){
      errEl.textContent = e.message;
      errEl.classList.remove('hidden');
      saveBtn.disabled = false; saveBtn.textContent = 'שמירה';
    }
  };
}

  };
  document.getElementById('eSave').onclick = async () => {
    const num = id => { const v = document.getElementById(id).value; return v === '' ? null : parseFloat(v); };
    const saveBtn = document.getElementById('eSave');
    saveBtn.disabled = true; saveBtn.textContent = 'שומרת...';
    try{
      let photo_url = null;
      const file = document.getElementById('ePhoto').files[0];
      if(file) photo_url = await uploadPhoto(file, PROFILE.id);
      await rest('progress_entries', { method:'POST', body:{
        trainee_id: PROFILE.id,
        entry_date: document.getElementById('eDate').value,
        weight_kg: num('eWeight'), chest_cm: num('eChest'), waist_cm: num('eWaist'),
        hips_cm: num('eHips'), arm_cm: num('eArm'), thigh_cm: num('eThigh'),
        notes: document.getElementById('eNotes').value.trim(),
        photo_url
      }});
      bg.remove();
      showToast('המדידה נשמרה');
      renderTraineeProgress();
    }catch(e){
      document.getElementById('eErr').textContent = e.message;
      document.getElementById('eErr').classList.remove('hidden');
      saveBtn.disabled = false; saveBtn.textContent = 'שמירה';
    }
  };
}

/* =====================================================================
   ראוטר ראשי
   ===================================================================== */
function render(){
  stopRestTimer();
  removeTimerFab();
  removePlaylistFab();
  if(STATE.view === 'config') return renderConfig();
  if(STATE.view === 'auth') return renderAuth();
  if(STATE.view === 'coach') return renderCoachHome();
  if(STATE.view === 'trainee') return renderTraineeDashboard();
  if(STATE.view === 'suspended') return renderSuspendedScreen();
}

function renderSuspendedScreen(){
  const app = document.getElementById('app');
  app.innerHTML = `
  <div class="centerscreen">
    <div class="card" style="text-align:center;">
      <div style="margin-bottom:22px;display:flex;justify-content:center;">${motionMark(38,true)}</div>
      <div style="font-size:40px;margin-bottom:12px;">⏸</div>
      <h1 style="text-transform:none;font-size:18px;color:var(--white);">החשבון שלך מושהה זמנית</h1>
      <p class="muted" style="font-size:14px;line-height:1.6;margin-top:10px;">
        המאמן/ת שלך השהה/תה זמנית את הגישה שלך לאפליקציה. פני אליו/ה ישירות לפרטים נוספים.
      </p>
      <button class="btn ghost full" id="suspendedLogout" style="margin-top:20px;">🚪 התנתקות</button>
    </div>
  </div>`;
  document.getElementById('suspendedLogout').onclick = () => {
    SESSION = null; PROFILE = null; STATE = { view:'auth', activeTraineeId:null, traineeCache:{} };
    clearLocal();
    render();
  };
}

/* Enter בתוך שדה טקסט בתוך מודל לוחץ אוטומטית על כפתור הפעולה הראשי (חוסך צורך לגעת בעכבר/מסך) */
document.addEventListener('keydown', (ev) => {
  if(ev.key !== 'Enter') return;
  const tag = ev.target.tagName;
  if(tag === 'TEXTAREA') return; // בטקסט ארוך, Enter אמור ליצור שורה חדשה
  const modal = ev.target.closest('.modal');
  if(!modal) return;
  const actions = modal.querySelector('.modal-actions');
  if(!actions) return;
  const primaryBtn = actions.querySelector('.btn.full') || actions.querySelector('.btn:not(.ghost)');
  if(primaryBtn && !primaryBtn.disabled){
    ev.preventDefault();
    primaryBtn.click();
  }
});

(async function boot(){
  try{ if(localStorage.getItem('motion_theme') === 'light') document.body.classList.add('light-theme'); }catch(e){}
  document.getElementById('app').innerHTML = `<div class="centerscreen">${motionMark(38,true)}</div>`;
  const sessRaw = (function(){ try{ return localStorage.getItem('motion_session'); }catch(e){ return null; } })();
  STATE.view = 'auth';
  if(sessRaw){
    const restored = await tryRestoreSession();
    if(!restored) STATE.view = 'auth';
  }
  render();
})();
</script>
