<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOTION — מערכת אימונים</title>
<style>
  :root{
    --bg:#0A0B0E;
    --bg-elevated:#14161C;
    --bg-card:#181B22;
    --border:#262A33;
    --blue:#2F6FED;
    --blue-bright:#5B93FF;
    --blue-dim:#132449;
    --white:#F4F5F7;
    --muted:#868C99;
    --green:#33C481;
    --red:#E5484D;
    --font-display: 'Segoe UI', Arial, sans-serif;
    --font-mono: 'Courier New', ui-monospace, monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--white);font-family:var(--font-display);}
  body{min-height:100vh;}
  #app{min-height:100vh;}
  .hidden{display:none !important;}

  /* ---------- Logo ---------- */
  .motion-mark{display:inline-flex;align-items:center;gap:10px;}
  .motion-mark svg{display:block;}
  .motion-wordmark{font-weight:800;letter-spacing:2px;font-size:20px;text-transform:uppercase;}
  .motion-wordmark span{color:var(--blue-bright);}

  /* ---------- Layout shells ---------- */
  .centerscreen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;position:relative;overflow:hidden;}
  .centerscreen::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(circle at 15% 20%, rgba(47,111,237,0.16), transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(47,111,237,0.10), transparent 40%);
    pointer-events:none;
  }
  .card{
    position:relative;background:var(--bg-card);border:1px solid var(--border);
    border-radius:14px;padding:32px;width:100%;max-width:400px;
    box-shadow:0 20px 60px rgba(0,0,0,0.5);
  }
  .card h1{font-size:15px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin:0 0 24px 0;font-weight:700;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px;}
  .field input, .field select, .field textarea{
    width:100%;background:var(--bg-elevated);border:1px solid var(--border);color:var(--white);
    padding:11px 12px;border-radius:8px;font-size:14px;font-family:inherit;
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--blue);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--blue);color:white;border:none;border-radius:8px;
    padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:0.3px;
    transition:background .15s ease, transform .1s ease;
  }
  .btn:hover{background:var(--blue-bright);}
  .btn:active{transform:scale(0.98);}
  .btn.full{width:100%;}
  .btn.ghost{background:transparent;border:1px solid var(--border);color:var(--white);}
  .btn.ghost:hover{border-color:var(--blue);color:var(--blue-bright);}
  .btn.small{padding:7px 12px;font-size:12px;}
  .btn.danger{background:var(--red);}
  .linklike{background:none;border:none;color:var(--blue-bright);cursor:pointer;font-size:13px;padding:0;text-decoration:underline;}
  .error{color:var(--red);font-size:13px;margin-top:10px;}
  .muted{color:var(--muted);}
  .hint{font-size:12px;color:var(--muted);margin-top:16px;line-height:1.6;}

  /* ---------- App shell ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:230px;flex-shrink:0;background:var(--bg-elevated);border-left:1px solid var(--border);
    padding:22px 18px;display:flex;flex-direction:column;gap:26px;
  }
  .sidebar .who{font-size:13px;color:var(--muted);border-top:1px solid var(--border);padding-top:14px;}
  .sidebar .who b{color:var(--white);display:block;font-size:14px;margin-bottom:2px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;
    color:var(--muted);cursor:pointer;font-size:14px;font-weight:600;
  }
  .nav-item.active, .nav-item:hover{background:var(--blue-dim);color:var(--blue-bright);}
  .main{flex:1;padding:32px 40px;max-width:1100px;}
  .topbar{display:none;}

  @media (max-width:820px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;align-items:center;justify-content:space-between;padding:14px 18px;border-left:none;border-bottom:1px solid var(--border);}
    .sidebar .navwrap{display:flex;gap:6px;}
    .sidebar .who{border-top:none;padding-top:0;display:none;}
    .main{padding:22px 18px;}
  }

  h2.page-title{font-size:22px;margin:0 0 4px 0;font-weight:800;}
  p.page-sub{color:var(--muted);font-size:13px;margin:0 0 26px 0;}

  .grid{display:grid;gap:16px;}
  .grid.cols-2{grid-template-columns:1fr 1fr;}
  .grid.cols-3{grid-template-columns:repeat(3,1fr);}
  @media (max-width:820px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr;}}

  .panel{background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:20px;}
  .panel h3{margin:0 0 14px 0;font-size:14px;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted);}

  .trainee-row{
    display:flex;align-items:center;justify-content:space-between;padding:13px 14px;
    border:1px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;background:var(--bg-elevated);
  }
  .trainee-row:hover{border-color:var(--blue);}
  .trainee-row .name{font-weight:700;}
  .trainee-row .meta{font-size:12px;color:var(--muted);font-family:var(--font-mono);}
  .avatar{
    width:36px;height:36px;border-radius:50%;background:var(--blue-dim);color:var(--blue-bright);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;margin-left:10px;
  }
  .row-left{display:flex;align-items:center;}

  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:right;color:var(--muted);font-weight:600;padding:8px 6px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;}
  td{padding:9px 6px;border-bottom:1px solid var(--border);font-family:var(--font-mono);}

  .day-row{display:flex;align-items:center;gap:12px;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;background:var(--bg-elevated);}
  .day-row.done{border-color:var(--green);}
  .day-row.rest{opacity:0.6;}
  .day-num{font-family:var(--font-mono);font-weight:800;color:var(--blue-bright);min-width:44px;text-align:center;line-height:1.3;}
  .day-check{width:20px;height:20px;flex-shrink:0;cursor:pointer;accent-color:var(--green);}
  .day-info{flex:1;}
  .day-info .t{font-weight:700;font-size:13px;}
  .day-info .d{font-size:12px;color:var(--muted);}
  .badge{font-size:10px;padding:2px 8px;border-radius:20px;background:var(--blue-dim);color:var(--blue-bright);font-weight:700;text-transform:uppercase;}

  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat .v{font-family:var(--font-mono);font-size:24px;font-weight:800;}
  .stat .l{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;}

  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:26px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;}
  .modal h3{margin-top:0;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--bg-elevated);border:1px solid var(--blue);color:var(--white);padding:12px 20px;border-radius:10px;font-size:13px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,0.5);}

  .empty{text-align:center;padding:40px 20px;color:var(--muted);}
  .empty svg{opacity:0.5;margin-bottom:12px;}

  .config-note{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:14px;font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:18px;}
  .config-note code{background:var(--bg);padding:1px 5px;border-radius:4px;color:var(--blue-bright);}

  /* ---------- v2: motion, streak, goals, photos ---------- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .main > *{animation:fadeUp .32s ease both;}
  .panel{transition:border-color .15s ease;}
  .day-row{transition:transform .12s ease, border-color .15s ease;}
  .day-row:hover{transform:translateX(-2px);}

  .ring-wrap{display:flex;align-items:center;gap:16px;}
  .ring-wrap svg{transform:rotate(-90deg);}
  .ring-bg{fill:none;stroke:var(--border);stroke-width:8;}
  .ring-fg{fill:none;stroke:var(--blue);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .5s ease;}
  .ring-label{font-family:var(--font-mono);font-size:20px;font-weight:800;}

  .streak-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#2F6FED,#5B93FF);color:#fff;padding:6px 14px;border-radius:20px;font-weight:800;font-size:13px;}
  .reminder-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--blue-dim);border:1px solid var(--blue);border-radius:10px;padding:12px 16px;margin-bottom:16px;font-size:13px;flex-wrap:wrap;}

  .mini-row{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted);font-family:var(--font-mono);}
  .mini-row b{color:var(--white);}

  .templates-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .template-chip{border:1px solid var(--border);background:var(--bg-elevated);color:var(--muted);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:12px;font-weight:700;text-align:center;}
  .template-chip:hover{border-color:var(--blue);color:var(--blue-bright);}
  .template-chip.selected{border-color:var(--blue);color:var(--blue-bright);background:var(--blue-dim);}

  .photo-thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--border);cursor:pointer;}
  .photo-input-wrap{position:relative;}
  .photo-preview{width:100%;max-height:160px;object-fit:cover;border-radius:10px;margin-top:8px;border:1px solid var(--border);display:none;}
  .lightbox-bg{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:60;padding:24px;cursor:zoom-out;}
  .lightbox-bg img{max-width:90vw;max-height:90vh;border-radius:12px;}

  .bottom-nav{display:none;}
  @media (max-width:820px){
    .sidebar .navwrap{display:none;}
    .bottom-nav{
      display:flex;position:fixed;bottom:0;right:0;left:0;background:var(--bg-elevated);
      border-top:1px solid var(--border);z-index:40;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
    }
    .bottom-nav .nav-item{flex:1;flex-direction:column;gap:2px;text-align:center;font-size:11px;padding:6px 4px;}
    .main{padding-bottom:78px;}
  }

  /* ---------- v3: exercise builder ---------- */
  .exercise-builder-row{display:grid;grid-template-columns:2fr 0.7fr 0.9fr 0.9fr auto;gap:8px;margin-bottom:8px;align-items:center;}
  .exercise-builder-row input{padding:9px 10px;font-size:13px;}
  @media (max-width:600px){.exercise-builder-row{grid-template-columns:1fr 1fr;}}
  .icon-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:8px;width:36px;height:36px;cursor:pointer;font-size:16px;flex-shrink:0;}
  .icon-btn:hover{border-color:var(--red);color:var(--red);}
  .add-exercise-link{color:var(--blue-bright);background:none;border:1px dashed var(--border);width:100%;padding:9px;border-radius:8px;cursor:pointer;font-size:13px;font-weight:700;}
  .add-exercise-link:hover{border-color:var(--blue);}

  .day-card{border:1px solid var(--border);border-radius:10px;margin-bottom:8px;background:var(--bg-elevated);overflow:hidden;}
  .day-card.done{border-color:var(--green);}
  .day-card.rest{opacity:0.6;}
  .day-card-head{display:flex;align-items:center;gap:12px;padding:10px;cursor:pointer;}
  .day-card-body{padding:0 14px 14px 14px;border-top:1px solid var(--border);display:none;}
  .day-card.expanded .day-card-body{display:block;}
  .day-card-body .empty{padding:16px;}
  .chevron{transition:transform .2s ease;color:var(--muted);margin-right:4px;}
  .day-card.expanded .chevron{transform:rotate(180deg);}

  .exercise-item{border:1px solid var(--border);border-radius:9px;padding:11px;margin-top:10px;background:var(--bg-card);}
  .exercise-item .ex-name{font-weight:700;font-size:13px;margin-bottom:2px;}
  .exercise-item .ex-target{font-size:11.5px;color:var(--muted);font-family:var(--font-mono);margin-bottom:8px;}
  .ex-log-grid{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px;align-items:end;}
  .ex-log-grid .f{display:flex;flex-direction:column;gap:4px;}
  .ex-log-grid label{font-size:10px;color:var(--muted);white-space:nowrap;}
  .ex-log-grid input{padding:9px 10px;font-size:14px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:8px;color:var(--white);width:100%;}
  .ex-log-grid input:focus{outline:none;border-color:var(--blue);}
  .ex-log-grid .btn{padding:9px 10px;font-size:12px;}
  @media (max-width:480px){
    .ex-log-grid{grid-template-columns:1fr 1fr;}
    .ex-log-grid .btn{grid-column:1 / -1;padding:11px;font-size:13px;}
  }
  .exercise-item.ex-done{border-color:var(--green);}

  /* ---------- v4: nutrition ---------- */
  .macro-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media (max-width:600px){.macro-grid{grid-template-columns:repeat(2,1fr);}}
  .macro-box{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
  .macro-box .v{font-family:var(--font-mono);font-weight:800;font-size:19px;}
  .macro-box .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;margin-top:2px;}
  .meal-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;background:var(--bg-elevated);}
  .meal-card .meal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .meal-card .meal-name{font-weight:800;font-size:14px;}
  .meal-card .meal-macros{font-size:11px;color:var(--blue-bright);font-family:var(--font-mono);}
  .meal-card .meal-desc{font-size:13px;color:var(--muted);line-height:1.6;white-space:pre-wrap;}

  /* ---------- v5: exercise videos ---------- */
  .video-input-row{margin-top:6px;}
  .video-input-row input{width:100%;padding:8px 10px;font-size:12px;}
  .video-link-btn{display:inline-flex;align-items:center;gap:6px;background:var(--blue-dim);color:var(--blue-bright);border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px;}
  .video-link-btn:hover{background:var(--blue);color:#fff;}
  .video-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;z-index:70;padding:20px;cursor:zoom-out;}
  .video-modal-inner{width:100%;max-width:800px;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;cursor:default;}
  .video-modal-inner iframe, .video-modal-inner video{width:100%;height:100%;border:none;}
  .video-modal-fallback{background:var(--bg-card);border-radius:12px;padding:30px;text-align:center;cursor:default;}

  /* ---------- v6: board, library, templates ---------- */
  .board-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;}
  @media (max-width:600px){.board-grid{grid-template-columns:repeat(7,1fr);}}
  .board-cell{aspect-ratio:1;border-radius:7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--font-mono);font-weight:700;cursor:pointer;border:1px solid var(--border);color:var(--muted);background:var(--bg-elevated);}
  .board-cell.done{background:var(--green);border-color:var(--green);color:#04170f;}
  .board-cell.rest{background:transparent;border-style:dashed;opacity:0.5;}
  .board-cell.missed{background:rgba(229,72,77,0.18);border-color:var(--red);color:var(--red);}
  .board-cell.today{outline:2px solid var(--blue-bright);}
  .board-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:11.5px;color:var(--muted);}
  .board-legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend-dot{width:10px;height:10px;border-radius:3px;display:inline-block;}

  .lib-search{width:100%;padding:10px 12px;margin-bottom:10px;}
  .lib-list{max-height:340px;overflow-y:auto;}
  .lib-item{border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-bottom:6px;cursor:pointer;}
  .lib-item:hover{border-color:var(--blue);}
  .lib-item .lib-name{font-weight:700;font-size:13px;}
  .lib-item .lib-cat{font-size:11px;color:var(--blue-bright);}
  .lib-item .lib-instr{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5;}
  .info-dot{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:var(--blue-dim);color:var(--blue-bright);font-size:11px;font-weight:800;cursor:pointer;margin-right:6px;}

  .tpl-row{display:flex;gap:8px;margin-bottom:12px;}
  .tpl-row select{flex:1;}
  .day-actions-row{display:flex;gap:6px;flex-wrap:wrap;}

  /* ---------- v15: mobile UX polish ---------- */
  @media (max-width:820px){
    .btn{padding:13px 18px;font-size:15px;}
    .btn.small{padding:10px 14px;font-size:13px;}
    .icon-btn{width:42px;height:42px;font-size:18px;}
    .day-check{width:24px;height:24px;}
    input, select, textarea{font-size:16px !important;} /* מונע זום אוטומטי באייפון בפוקוס */
    .modal{padding:20px;border-radius:16px 16px 0 0;}
    .modal-bg{align-items:flex-end;padding:0;}
    .modal{max-height:85vh;}
  }

  .skeleton{background:linear-gradient(90deg, var(--bg-elevated) 25%, var(--border) 50%, var(--bg-elevated) 75%);background-size:200% 100%;animation:shimmer 1.4s ease-in-out infinite;border-radius:8px;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  .skel-row{height:58px;margin-bottom:8px;}
  .skel-line{height:14px;margin-bottom:8px;width:60%;}
  .skel-block{height:100px;margin-bottom:16px;}

  .search-input{width:100%;padding:11px 14px;background:var(--bg-elevated);border:1px solid var(--border);border-radius:9px;color:var(--white);font-size:14px;margin-bottom:14px;}
  .search-input:focus{outline:none;border-color:var(--blue);}

  .swipe-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;padding-left:16px;background:linear-gradient(to left, var(--green), transparent);border-radius:10px;opacity:0;pointer-events:none;transition:opacity .1s ease;color:#04170f;font-weight:800;font-size:13px;}
  .day-card{position:relative;overflow:hidden;transition:transform .15s ease;}

  /* ---------- v16: rest timer, quick-fill, readability ---------- */
  .exercise-item .ex-name{font-size:15px;}
  .exercise-item .ex-target{font-size:12.5px;}
  .today-badge{background:var(--blue);color:#fff;font-size:10px;padding:2px 9px;border-radius:20px;font-weight:800;text-transform:uppercase;letter-spacing:0.4px;}
  .day-card.is-today{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);}

  .same-last-btn{background:none;border:1px dashed var(--blue-dim);color:var(--blue-bright);border-radius:7px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;margin-bottom:8px;}
  .same-last-btn:hover{border-color:var(--blue);}

  .rest-timer-bar{
    position:fixed;top:50%;left:10px;transform:translateY(-50%);background:var(--bg-card);border:2px solid var(--blue);border-radius:16px;
    padding:14px 12px;z-index:80;width:120px;
    display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,0.5);
    animation:fadeIn .25s ease both;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(-50%) scale(0.9);}to{opacity:1;transform:translateY(-50%) scale(1);}}
  .rest-timer-bar .rt-count{font-family:var(--font-mono);font-size:26px;font-weight:800;color:var(--blue-bright);line-height:1;}
  .rest-timer-bar .rt-label{font-size:10px;color:var(--muted);text-align:center;line-height:1.3;}
  .rest-timer-bar .rt-actions{display:flex;flex-direction:column;gap:6px;width:100%;}
  .rest-timer-bar .rt-actions .btn{width:100%;padding:6px 4px;font-size:10px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================================================================
   MOTION — קליינט Supabase מינימלי (fetch ישיר ל-REST + Auth, ללא ספרייה)
   ===================================================================== */

function saveLocal(){
  try{
    localStorage.setItem('motion_config', JSON.stringify(CONFIG));
    if(SESSION) localStorage.setItem('motion_session', JSON.stringify(SESSION));
    else localStorage.removeItem('motion_session');
  }catch(e){ /* אחסון לא זמין - נמשיך בלי שמירה */ }
}
function clearLocal(){
  try{ localStorage.removeItem('motion_session'); }catch(e){}
}
async function refreshAccessToken(){
  if(!SESSION || !SESSION.refresh_token) return false;
  try{
    const res = await fetch(`${CONFIG.url}/auth/v1/token?grant_type=refresh_token`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'apikey': CONFIG.anonKey },
      body: JSON.stringify({ refresh_token: SESSION.refresh_token })
    });
    if(!res.ok) return false;
    const data = await res.json();
    if(!data.access_token) return false;
    SESSION = { access_token: data.access_token, refresh_token: data.refresh_token || SESSION.refresh_token, user: data.user || SESSION.user };
    saveLocal();
    return true;
  }catch(e){
    return false;
  }
}

async function tryRestoreSession(){
  try{
    const sessRaw = localStorage.getItem('motion_session');
    if(!sessRaw) return false;
    SESSION = JSON.parse(sessRaw);
    let rows;
    try{
      rows = await rest('profiles', { query:`?id=eq.${SESSION.user.id}&select=*` });
    }catch(innerErr){
      // ה-access token כנראה פג תוקף (בד"כ אחרי שעה) - ננסה לרענן אותו עם ה-refresh token ולנסות שוב
      const refreshed = await refreshAccessToken();
      if(!refreshed) throw innerErr;
      rows = await rest('profiles', { query:`?id=eq.${SESSION.user.id}&select=*` });
    }
    if(!rows || !rows.length) throw new Error('no profile');
    PROFILE = rows[0];
    STATE.view = PROFILE.role === 'coach' ? 'coach' : 'trainee';
    return true;
  }catch(e){
    SESSION = null; PROFILE = null;
    clearLocal();
    return false;
  }
}

function showToast(msg, isError){
  const el = document.createElement('div');
  el.className = 'toast';
  if(isError) el.style.borderColor = 'var(--red)';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 3200);
}

async function authRequest(path, body){
  const res = await fetch(`${CONFIG.url}/auth/v1/${path}`, {
    method:'POST',
    headers:{ 'Content-Type':'application/json', 'apikey': CONFIG.anonKey },
    body: JSON.stringify(body)
  });
  const rawText = await res.text();
  let data = {};
  try{ data = JSON.parse(rawText); }catch(e){ data = {}; }
  if(!res.ok){
    const detail = data.error_description || data.msg || data.error || data.message || data.error_code || rawText || (res.status + ' ' + res.statusText);
    throw new Error(`(${res.status}) ${detail}`);
  }
  return data;
}

async function rest(table, { method='GET', query='', body=null, token=null, prefer=null, _retried=false } = {}){
  const headers = { 'Content-Type':'application/json', 'apikey': CONFIG.anonKey };
  headers['Authorization'] = 'Bearer ' + (token || (SESSION && SESSION.access_token) || CONFIG.anonKey);
  if(prefer) headers['Prefer'] = prefer;
  const res = await fetch(`${CONFIG.url}/rest/v1/${table}${query}`, {
    method, headers, body: body ? JSON.stringify(body) : undefined
  });
  if(res.status === 401 && !token && !_retried && SESSION && SESSION.refresh_token){
    const refreshed = await refreshAccessToken();
    if(refreshed) return rest(table, { method, query, body, prefer, _retried:true });
  }
  if(!res.ok){
    const errText = await res.text().catch(()=> '');
    throw new Error(`שגיאת שרת (${table}): ${errText || res.status}`);
  }
  if(res.status === 204) return null;
  return res.json().catch(()=>null);
}

async function uploadPhoto(file, userId){
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'') || 'jpg';
  const path = `${userId}/${Date.now()}.${ext}`;
  const res = await fetch(`${CONFIG.url}/storage/v1/object/motion-photos/${path}`, {
    method:'POST',
    headers:{
      'apikey': CONFIG.anonKey,
      'Authorization': 'Bearer ' + (SESSION && SESSION.access_token || CONFIG.anonKey),
      'Content-Type': file.type || 'image/jpeg'
    },
    body: file
  });
  if(!res.ok){
    const t = await res.text().catch(()=> '');
    throw new Error('העלאת התמונה נכשלה: ' + (t || res.status) + ' (ודאי שהרצת את motion-supabase-schema-v2-addon.sql)');
  }
  return `${CONFIG.url}/storage/v1/object/public/motion-photos/${path}`;
}

function exportCSV(filename, headers, rows){
  const escape = v => `"${String(v ?? '').replace(/"/g,'""')}"`;
  const csv = '\uFEFF' + [headers.map(escape).join(',')].concat(
    rows.map(r => r.map(escape).join(','))
  ).join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}

let REST_TIMER_INTERVAL = null;
function startRestTimer(seconds){
  stopRestTimer();

  const bar = document.createElement('div');
  bar.className = 'rest-timer-bar';
  bar.id = 'restTimerBar';
  bar.innerHTML = `
    <div>

  document.getElementById('rtAdd30').onclick = () => { remaining += 30; document.getElementById('rtCount').textContent = remaining; };
  document.getElementById('rtSkip').onclick = () => stopRestTimer();
  REST_TIMER_INTERVAL = setInterval(() => {

  if(REST_TIMER_INTERVAL) clearInterval(REST_TIMER_INTERVAL);
  REST_TIMER_INTERVAL = null;
  const bar = document.getElementById('restTimerBar');
  if(bar) bar.remove();
}

function findLastLoggedValues(exerciseName, allDays, beforeDayNumber){
  const norm = s => (s||'').trim().toLowerCase();
  const matches = [];
  allDays.forEach(d => {
    if(d.day_number >= beforeDayNumber) return;
    (d.exercises || []).forEach(ex => {
      if(norm(ex.name) === norm(exerciseName) && (ex.actual_weight_kg!=null || ex.actual_reps!=null || ex.actual_sets!=null)){
        matches.push({ day_number: d.day_number, sets: ex.actual_sets, reps: ex.actual_reps, weight: ex.actual_weight_kg });
      }
    });
  });
  matches.sort((a,b)=>b.day_number-a.day_number);
  return matches[0] || null;
}

function calcStreak(days){
  // רצף ימי אימון: סופרת אחורה מהיום המספרי הגבוה ביותר שסומן/חלף, ימי מנוחה לא שוברים רצף
  const sorted = days.slice().sort((a,b)=>b.day_number-a.day_number);
  let streak = 0;
  for(const d of sorted){
    if(d.is_rest_day) continue;
    if(d.completed) streak++;
    else break;
  }
  return streak;
}

  'כל הכבוד! עוד יום קרוב יותר ליעד 💪',

];
function randomMotivation(){
  return MOTIVATION_MESSAGES[Math.floor(Math.random()*MOTIVATION_MESSAGES.length)];
}
function dayDate(startDateStr, dayNumber){
  const d = new Date(startDateStr);
  d.setDate(d.getDate() + (dayNumber - 1));
  return d;
}
function dayLabel(startDateStr, dayNumber){
  const d = dayDate(startDateStr, dayNumber);
  return { weekday: HEBREW_WEEKDAYS[d.getDay()], dateStr: d.toLocaleDateString('he-IL', {day:'2-digit', month:'2-digit'}), fullDate: d.toLocaleDateString('he-IL'), dateObj: d };
}

function openVideoModal(url){
  const bg = document.createElement('div');
  bg.className = 'video-modal-bg';
  let inner = '';
  const yt = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([a-zA-Z0-9_-]{6,})/);
  const vimeo = url.match(/vimeo\.com\/(\d+)/);
  if(yt){
    inner = `<iframe src="https://www.youtube.com/embed/${yt[1]}?autoplay=1" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
  } else if(vimeo){
    inner = `<iframe src="https://player.vimeo.com/video/${vimeo[1]}?autoplay=1" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>`;
  } else if(/\.(mp4|webm|mov|ogg)(\?|$)/i.test(url)){
    inner = `<video src="${url}" controls autoplay playsinline></video>`;
  } else {
    bg.innerHTML = `<div class="video-modal-fallback"><p style="margin-bottom:14px;">לא הצלחנו להטמיע תצוגה מקדימה לקישור הזה.</p><a href="${url}" target="_blank" rel="noopener" class="btn">פתיחה בטאב חדש ↗</a></div>`;
    document.body.appendChild(bg);
    bg.onclick = (ev) => { if(ev.target === bg) bg.remove(); };
    return;
  }
  bg.innerHTML = `<div class="video-modal-inner">${inner}</div>`;
  document.body.appendChild(bg);
  bg.onclick = (ev) => { if(ev.target === bg) bg.remove(); };
}

function progressRing(pct, size){
  size = size || 64;
  const r = (size/2) - 8;
  const c = 2*Math.PI*r;
  const offset = c - (Math.max(0,Math.min(100,pct))/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle class="ring-bg" cx="${size/2}" cy="${size/2}" r="${r}"/>
    <circle class="ring-fg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
  </svg>`;
}
function logoSVG(size){
  size = size || 34;
  return `
  <svg width="${size}" height="${size}" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="mgrad" x1="4" y1="44" x2="44" y2="4" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#1D4FC4"/>
        <stop offset="1" stop-color="#8FB3FF"/>
      </linearGradient>
    </defs>
    <rect width="48" height="48" rx="12" fill="#0A0B0E"/>
    <path d="M13 12 L24 24 L13 36" stroke="url(#mgrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>
    <path d="M21 10 L34 24 L21 38" stroke="url(#mgrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8"/>
    <path d="M29 8 L44 24 L29 40" stroke="url(#mgrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </svg>`;
}

function motionMark(size, withWord){
  return `<div class="motion-mark">${logoSVG(size)}${withWord ? '<span class="motion-wordmark">MOTION</span>' : ''}</div>`;
}

function renderAuth(){

    try{
      const data = await authRequest('token?grant_type=password', { email, password });

    `<div class="panel"><div class="skeleton skel-row"></div><div class="skeleton skel-row"></div><div class="skeleton skel-row"></div></div>`

  let trainees = [];
  try{
    trainees = await rest('profiles', { query:`?coach_id=eq.${PROFILE.id}&select=*&order=created_at.desc` }) || [];
  }catch(e){ showToast(e.message, true); }

  let statsByTrainee = {};
  if(trainees.length){
    try{
      const ids = trainees.map(t=>t.id).join(',');
      const progressAll = await rest('progress_entries', { query:`?trainee_id=in.(${ids})&select=trainee_id,weight_kg,entry_date&order=entry_date.asc` }) || [];
      const programsAll = await rest('programs', { query:`?trainee_id=in.(${ids})&select=trainee_id,start_date,program_days(day_number,completed,is_rest_day)&order=start_date.desc` }) || [];
      trainees.forEach(t => {
        const mine = progressAll.filter(p=>p.trainee_id===t.id);
        const lastW = mine.length ? mine[mine.length-1].weight_kg : null;
        const lastEntryDate = mine.length ? new Date(mine[mine.length-1].entry_date) : null;
        const daysSince = lastEntryDate ? Math.floor((Date.now()-lastEntryDate.getTime())/86400000) : null;
        const prog = programsAll.find(p=>p.trainee_id===t.id);
        const dueProgDays = prog ? (prog.program_days||[]).filter(d => dayDate(prog.start_date, d.day_number) <= new Date()) : [];
        const workDays = dueProgDays.filter(d=>!d.is_rest_day);
        const adherence = workDays.length ? Math.round(100*workDays.filter(d=>d.completed).length/workDays.length) : null;
        statsByTrainee[t.id] = { lastW, adherence, daysSince };
      });
    }catch(e){ /* לא קריטי - נציג רשימה בלי סטטיסטיקות */ }
  }

  const rowsHtml = trainees.length ? trainees.map(t => {
    const s = statsByTrainee[t.id] || {};
    return `
    <div class="trainee-row" data-tid="${t.id}">
      <div class="row-left">
        <div class="avatar">${(t.full_name||'?').trim()[0] || '?'}</div>

            <span>${s.lastW!=null ? `⚖️ <b>${s.lastW}</b> ק"ג` : 'אין מדידות עדיין'}</span>
            ${s.adherence!=null ? `<span>💪 <b>${s.adherence}%</b> עמידה בתוכנית</span>` : ''}
            ${(s.daysSince===null || s.daysSince>=7) ? `<span style="color:var(--red);">⚠ ${s.daysSince===null?'אין פעילות':`${s.daysSince} ימים ללא עדכון`}</span>` : ''}
          </div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <button class="icon-btn" data-delete-trainee="${t.id}" data-name="${t.full_name}" title="מחיקת מתאמן">🗑</button>
        <div class="muted">›</div>
      </div>
    </div>`;
  }).join('') : `<div class="empty">${logoSVG(46)}<div>עדיין אין מתאמנים. הוסיפי את הראשון/ה שלך.</div></div>`;

  document.querySelector('.main').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;">
      <div>
        <h2 class="page-title">המתאמנים שלי</h2>

    <div class="panel" id="traineesPanel">${rowsHtml}</div>

        const name = (row.querySelector('.name')?.textContent || '').toLowerCase();
        row.style.display = !q || name.includes(q) ? '' : 'none';
      });
    };
  }

  document.getElementById('addTraineeBtn').onclick = openAddTraineeModal;
  document.querySelectorAll('[data-tid]').forEach(el => {
    el.onclick = () => { STATE.activeTraineeId = el.getAttribute('data-tid'); renderCoachTraineeDetail(); };
  });

function openMoveDayModal(dayId, currentNum, program, onDone){
  onDone = onDone || renderCoachTraineeDetail;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const totalDays = program.duration_days || (program.program_days||[]).length;
  const byNumber = {};
  (program.program_days || []).forEach(d => { byNumber[d.day_number] = d; });
  const options = [];
  for(let n=1; n<=totalDays; n++){
    const lbl = dayLabel(program.start_date, n);
    const existing = byNumber[n];
    let suffix = '';
    if(n === currentNum) suffix = ' (היום הנוכחי)';
    else if(existing) suffix = existing.is_rest_day ? ' — כרגע יום מנוחה' : ` — כרגע: ${existing.title || 'אימון'} (יוחלף)`;
    else suffix = ' — ריק';
    options.push(`<option value="${n}" ${n===currentNum?'selected':''}>${lbl.weekday}, ${lbl.dateStr}${suffix}</option>`);
  }
  bg.innerHTML = `
    <div class="modal">
      <h3>העברת האימון ליום אחר</h3>
      <div class="field">
        <label>לאיזה יום להעביר?</label>
        <select id="moveDaySelect">${options.join('')}</select>
      </div>
      <p class="muted" style="font-size:12px;">אם היום הנבחר כבר תפוס באימון אחר, שני האימונים יוחלפו ביניהם.</p>
      <div id="moveErr" class="error hidden"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="moveCancel">ביטול</button>
        <button class="btn full" id="moveConfirm">העברה</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  document.getElementById('moveCancel').onclick = () => bg.remove();
  document.getElementById('moveConfirm').onclick = async () => {
    const errEl = document.getElementById('moveErr');
    const targetNum = parseInt(document.getElementById('moveDaySelect').value);
    if(!targetNum){ errEl.textContent = 'נא לבחור יום.'; errEl.classList.remove('hidden'); return; }
    if(targetNum === currentNum){ bg.remove(); return; }
    try{
      const allDays = program.program_days || [];
      const targetDay = allDays.find(d => d.day_number === targetNum);
      const targetLbl = dayLabel(program.start_date, targetNum);
      if(targetDay){
        await rest('program_days', { method:'PATCH', query:`?id=eq.${targetDay.id}`, body:{ day_number: -1 } });
        await rest('program_days', { method:'PATCH', query:`?id=eq.${dayId}`, body:{ day_number: targetNum } });
        await rest('program_days', { method:'PATCH', query:`?id=eq.${targetDay.id}`, body:{ day_number: currentNum } });
        showToast(`הוחלף עם ${targetLbl.weekday}, ${targetLbl.dateStr}`);
      } else {
        await rest('program_days', { method:'PATCH', query:`?id=eq.${dayId}`, body:{ day_number: targetNum } });
        showToast(`הועבר ל${targetLbl.weekday}, ${targetLbl.dateStr}`);
      }
      bg.remove();
      onDone();
    }catch(e){
      errEl.textContent = e.message;
      errEl.classList.remove('hidden');
    }
  };
}

function openAdherenceBoardModal(program, onDone){
  onDone = onDone || renderCoachTraineeDetail;
  const existingDays = (program.program_days || []).slice().sort((a,b)=>a.day_number-b.day_number);
  const byNumber = {};
  existingDays.forEach(d => { byNumber[d.day_number] = d; });
  const today = new Date(); today.setHours(0,0,0,0);
  const totalDays = program.duration_days || existingDays.length;
  const cellsHtml = [];
  for(let n=1; n<=totalDays; n++){
    const d = byNumber[n];
    const lbl = dayLabel(program.start_date, n);
    const cellDate = lbl.dateObj; cellDate.setHours(0,0,0,0);
    const isToday = cellDate.getTime() === today.getTime();
    const isPast = cellDate.getTime() < today.getTime();
    let cls = '';
    if(!d) cls = 'rest'; // יום שעדיין לא נבנה - מוצג מעומעם כמו יום מנוחה
    else if(d.is_rest_day) cls = 'rest';
    else if(d.completed) cls = 'done';
    else if(isPast) cls = 'missed';
    if(isToday) cls += ' today';
    const canMove = d && !d.is_rest_day;
    const titleText = d ? `${lbl.weekday} — ${lbl.fullDate}${d.title ? ' · '+d.title : ''}${canMove ? ' (לחיצה להעברה ליום אחר)' : ''}` : `${lbl.weekday} — ${lbl.fullDate} · טרם נבנה`;
    cellsHtml.push(`<div class="board-cell ${cls}" title="${titleText}" ${canMove ? `data-boardmove="${d.id}" data-boardnum="${n}" style="cursor:pointer;"` : ''}>
      <span style="font-size:12px;">${lbl.weekday.replace('יום ','')}</span>
      <span style="font-size:9px;opacity:0.8;">${lbl.dateStr}</span>
    </div>`);
  }
  const workDays = existingDays.filter(d=>!d.is_rest_day);
  const completedCount = workDays.filter(d=>d.completed).length;
  const missedCount = workDays.filter(d => {

/* =====================================================================
   מסך מאמן — פרטי מתאמן: היקפים / משקל + עריכת תוכנית
   ===================================================================== */
function svgLineChart(points, w, h, goal){
  // points: [{x: index, y: value}]
  w = w || 560; h = h || 160;
  if(!points.length) return `<div class="empty">אין עדיין נתוני משקל</div>`;
  const vals = points.map(p=>p.y).concat(goal!=null ? [parseFloat(goal)] : []);
  const min = Math.min(...vals), max = Math.max(...vals);
  const pad = 24;
  const range = (max - min) || 1;
  const stepX = points.length > 1 ? (w - pad*2) / (points.length - 1) : 0;
  const coords = points.map((p,i) => {
    const x = pad + i * stepX;
    const y = h - pad - ((p.y - min) / range) * (h - pad*2);
    return [x,y];
  });
  const path = coords.map((c,i) => (i===0?'M':'L') + c[0].toFixed(1) + ',' + c[1].toFixed(1)).join(' ');
  const dots = coords.map(c => `<circle cx="${c[0].toFixed(1)}" cy="${c[1].toFixed(1)}" r="3.5" fill="#5B93FF"/>`).join('');
  let goalLine = '';
  if(goal!=null){
    const gy = h - pad - ((parseFloat(goal) - min) / range) * (h - pad*2);
    goalLine = `<line x1="${pad}" y1="${gy.toFixed(1)}" x2="${w-pad}" y2="${gy.toFixed(1)}" stroke="#33C481" stroke-width="1.5" stroke-dasharray="5,4"/>`;
  }
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="overflow:visible;">
    ${goalLine}
    <path d="${path}" fill="none" stroke="#2F6FED" stroke-width="2.5"/>
    ${dots}
  </svg>`;
}

function renderDaysList(days, startDate){
  if(!days.length) return `<div class="empty">אין ימים בתוכנית עדיין</div>`;
  const sorted = days.slice().sort((a,b)=>a.day_number-b.day_number);
  return sorted.map(d => {
    const exCount = (d.exercises || []).length;
    const lbl = startDate ? dayLabel(startDate, d.day_number) : null;
    return `
    <div class="day-row ${d.completed?'done':''} ${d.is_rest_day?'rest':''}" data-open-day="${d.id}" style="cursor:${d.is_rest_day?'default':'pointer'};">
      <div class="day-num" style="min-width:64px;">${lbl ? `${lbl.weekday}<div style="font-size:10px;color:var(--muted);font-weight:600;">${lbl.dateStr}</div>` : `D${d.day_number}`}</div>
      <div class="day-info">
        <div class="t">${d.is_rest_day ? 'יום מנוחה' : `${exCount} תרגילים`}</div>
      </div>
      ${d.is_rest_day ? `<span class="badge">מנוחה</span>` : `<button class="btn ghost small" data-manage-ex="${d.id}">✎ תרגילים</button>`}
      ${d.trainee_note ? `<span class="badge" style="background:var(--blue-dim);color:var(--blue-bright);" title="${d.trainee_note.replace(/"/g,'&quot;')}">💬 הערה</span>` : ''}
      <button class="icon-btn" data-move-day="${d.id}" data-daynum="${d.day_number}" title="העברה ליום אחר">↕</button>
      ${d.completed ? `<span class="badge" style="background:#0F3D2A;color:var(--green);">בוצע</span>` : ''}
    </div>`;
  }).join('');
}

function openMakeRecurringModal(program){
  const existingDays = (program.program_days || []).slice().sort((a,b)=>a.day_number-b.day_number);
  const maxBuilt = existingDays.length ? Math.max(...existingDays.map(d=>d.day_number)) : 0;
  const suggestedLen = Math.min(maxBuilt, 7) || 7;
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>המשך אוטומטית לפי השבוע שכבר בנית</h3>
      <p class="muted" style="font-size:13px;line-height:1.6;">
        זה ייקח את הימים שכבר בנית (מיום 1 עד המספר שתבחרי), וימשיך לחזור עליהם אוטומטית כל שבוע עד סוף התוכנית - בלי שתצטרכי להוסיף ימים ידנית שוב.
      </p>
      <div class="field">
        <label>אורך המחזור השבועי (בימים)</label>
        <input id="recurLen" type="number" value="${suggestedLen}" min="1" max="${maxBuilt || 30}">
      </div>
      <div id="recurErr" class="error hidden"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="recurCancel">ביטול</button>
        <button class="btn full" id="recurConfirm">הפעלה</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  document.getElementById('recurCancel').onclick = () => bg.remove();
  document.getElementById('recurConfirm').onclick = async () => {
    const errEl = document.getElementById('recurErr');
    const len = parseInt(document.getElementById('recurLen').value);
    if(!len || len < 1){ errEl.textContent = 'נא להזין אורך מחזור תקין.'; errEl.classList.remove('hidden'); return; }
    const week = [];
    for(let n=1; n<=len; n++){
      const d = existingDays.find(x => x.day_number === n);
      if(!d){ week.push({ title:'מנוחה', is_rest_day:true }); continue; }
      week.push({
        title: d.title || '', description: d.description || '', is_rest_day: !!d.is_rest_day,
        exercises: (d.exercises || []).map(e => ({ name:e.name, sets:e.target_sets, reps:e.target_reps, weight:e.target_weight_kg }))
      });
    }
    try{
      await rest('programs', { method:'PATCH', query:`?id=eq.${program.id}`, body:{ week_pattern: week, template_key: 'custom' } });
      bg.remove();
      showToast('מעכשיו זה ימשיך אוטומטית כל שבוע 🔁');
      renderCoachTraineeDetail();
    }catch(e){
      errEl.textContent = e.message;
      errEl.classList.remove('hidden');
    }
  };
}

async function extendProgramByOneWeek(program){
  if(!program.week_pattern || !program.week_pattern.length) throw new Error('לתוכנית הזו אין מחזור שבועי שמור.');
  const week = program.week_pattern;
  const days = program.program_days || [];
  const existingMax = days.length ? Math.max(...days.map(d=>d.day_number)) : 0;
  const target = Math.min(program.duration_days, existingMax + 7);
  if(target <= existingMax) throw new Error('התוכנית כבר הגיעה לסוף המשך שלה.');
  for(let n=existingMax+1; n<=target; n++){
    const tpl = week[(n-1) % week.length];
    const created = await rest('program_days', { method:'POST', body:{
      program_id: program.id, day_number: n,
      title: tpl.title, description: tpl.description || '', is_rest_day: !!tpl.is_rest_day
    }, prefer:'return=representation' });
    const dayRow = created && created[0];
    if(dayRow && !tpl.is_rest_day && tpl.exercises && tpl.exercises.length){
      await rest('exercises', { method:'POST', body: tpl.exercises.map((ex,idx) => ({
        day_id: dayRow.id, order_index: idx, name: ex.name,
        target_sets: ex.sets || null, target_reps: ex.reps || null, target_weight_kg: ex.weight || null
      })) });
    }
  }
}

async function autoExtendProgramIfNeeded(program){
  if(!program || !program.week_pattern || !program.week_pattern.length) return program;
  const week = program.week_pattern;
  const days = program.program_days || [];
  const existingMax = days.length ? Math.max(...days.map(d=>d.day_number)) : 0;
  const daysSinceStart = Math.floor((Date.now() - new Date(program.start_date).getTime())/86400000) + 1;
  const target = Math.min(program.duration_days, Math.max(daysSinceStart + 7, 7)); // תמיד שומרת שבוע קדימה כמלאי
  if(target <= existingMax) return program;
  const newDays = [];
  for(let n=existingMax+1; n<=target; n++){
    const tpl = week[(n-1) % week.length];
    try{
      const created = await rest('program_days', { method:'POST', body:{
        program_id: program.id, day_number: n,
        title: tpl.title, description: tpl.description || '', is_rest_day: !!tpl.is_rest_day
      }, prefer:'return=representation' });
      const dayRow = created && created[0];
      if(!dayRow) continue;
      let exercisesForDay = [];
      if(!tpl.is_rest_day && tpl.exercises && tpl.exercises.length){
        const exBody = tpl.exercises.map((ex,idx) => ({
          day_id: dayRow.id, order_index: idx, name: ex.name,
          target_sets: ex.sets || null, target_reps: ex.reps || null, target_weight_kg: ex.weight || null
        }));
        const createdEx = await rest('exercises', { method:'POST', body: exBody, prefer:'return=representation' });
        exercisesForDay = createdEx || [];
      }
      newDays.push({ ...dayRow, exercises: exercisesForDay });
    }catch(e){ break; } // אם משהו נכשל, לא נעצור את טעינת האפליקציה - פשוט נמשיך עם מה שיש
  }
  program.program_days = days.concat(newDays);
  return program;
}

async function renderTraineeHome(){
  const app = document.getElementById('app');
  app.innerHTML = appShell(
    [{key:'program', label:'📋 התוכנית שלי'}, {key:'nutrition', label:'🍽 התפריט שלי'}, {key:'progress', label:'📈 ההתקדמות שלי'}],
    'program',
    `<div class="skeleton skel-block"></div><div class="skeleton skel-row"></div><div class="skeleton skel-row"></div>`
  );
  bindShellNav({ program: renderTraineeHome, nutrition: renderTraineeNutrition, progress: renderTraineeProgress });

  let programs = [];
  try{
    programs = await rest('programs', { query:`?trainee_id=eq.${PROFILE.id}&select=*,program_days(*,exercises(*))&order=start_date.desc` }) || [];
  }catch(e){ showToast(e.message, true); }
  await getExerciseLibrary();

  let program = programs[0] || null;
  if(program) program = await autoExtendProgramIfNeeded(program);
  const days = program ? (program.program_days || []).slice().sort((a,b)=>a.day_number-b.day_number) : [];
  const doneCount = days.filter(d=>d.completed).length;
  // אחוז העמידה בתוכנית נספר רק לפי ימים שכבר הגיעו (היום ואחורה) - ימים עתידיים שנוצרו מראש כ"מלאי" לא אמורים להיספר כ"לא בוצע"
  const dueDays = program ? days.filter(d => dayDate(program.start_date, d.day_number) <= new Date()) : days;
  const workDaysCount = dueDays.filter(d=>!d.is_rest_day).length;
  const pct = workDaysCount ? Math.round(100*dueDays.filter(d=>!d.is_rest_day && d.completed).length/workDaysCount) : 0;
  const streak = calcStreak(days);

  let lastEntryDate = null;
  try{
    const recent = await rest('progress_entries', { query:`?trainee_id=eq.${PROFILE.id}&select=entry_date&order=entry_date.desc&limit=1` });
    if(recent && recent.length) lastEntryDate = new Date(recent[0].entry_date);
  }catch(e){}
  const daysSinceEntry = lastEntryDate ? Math.floor((Date.now()-lastEntryDate.getTime())/86400000) : null;
  const reminderHtml = (daysSinceEntry===null || daysSinceEntry>=7) ? `
    <div class="reminder-banner">
      <span>📏 ${daysSinceEntry===null ? 'עדיין לא הזנת אף מדידה' : `לא הזנת מדידה כבר ${daysSinceEntry} ימים`} — כדאי לעדכן משקל והיקפים.</span>
      <button class="btn small" id="reminderLogBtn">לרישום מדידה</button>
    </div>` : '';

  const daysLeft = program ? Math.max(0, program.duration_days - Math.floor((Date.now() - new Date(program.start_date).getTime())/86400000)) : null;
  const todayStr = new Date().toDateString();
  const todaysDay = program ? days.find(d => dayDate(program.start_date, d.day_number).toDateString() === todayStr) : null;

  document.querySelector('.main').innerHTML = `
    ${reminderHtml}
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;margin-bottom:22px;">
      <div>
        <h2 class="page-title" style="margin-bottom:8px;">${program ? program.title : 'התוכנית שלי'}</h2>
        ${streak>0 ? `<div class="streak-badge">🔥 ${streak} ימי רצף</div>` : `<p class="page-sub" style="margin:0;">${program ? `${dueDays.filter(d=>d.completed).length} / ${dueDays.length} ימים הושלמו` : 'המאמן שלך עדיין לא בנה עבורך תוכנית'}</p>`}
        ${daysLeft!=null ? `<p class="muted" style="font-size:12px;margin-top:4px;">${daysLeft} ימים נשארו בתוכנית</p>` : ''}
      </div>
      ${program ? `<div style="display:flex;align-items:center;gap:14px;">
        ${todaysDay && !todaysDay.is_rest_day ? `<button class="btn small" id="todayWorkoutBtn">💪 האימון של היום</button>` : ''}
        <button class="btn ghost small" id="myBoardBtn">🗓 הלוח שלי</button>
        <div class="ring-wrap">${progressRing(pct)}<div><div style="font-family:var(--font-mono);font-weight:800;font-size:18px;">${pct}%</div><div class="muted" style="font-size:12px;">עמידה בתוכנית</div></div></div>
      </div>` : ''}
    </div>
    ${days.length ? `<p class="muted" style="font-size:11.5px;margin-bottom:10px;">💡 טיפ: אפשר להחליק (swipe) על כרטיס אימון כדי לסמן/לבטל סימון בוצע במהירות</p>` : ''}
    <div class="panel">
      ${days.length ? days.map(d => {
        const exs = (d.exercises || []).slice().sort((a,b)=>a.order_index-b.order_index);
        const lbl = program ? dayLabel(program.start_date, d.day_number) : null;
        const isToday = todaysDay && todaysDay.id === d.id;
        return `
        <div class="day-card ${d.completed?'done':''} ${d.is_rest_day?'rest':''} ${isToday?'is-today':''}" data-daycard="${d.id}">
          <div class="day-card-head" data-toggle="${d.id}">
            <input type="checkbox" class="day-check" data-dayid="${d.id}" ${d.completed?'checked':''} ${d.is_rest_day?'disabled':''} onclick="event.stopPropagation()">
            <div class="day-num" style="min-width:64px;">${lbl ? `${lbl.weekday}<div style="font-size:10px;color:var(--muted);font-weight:600;">${lbl.dateStr}</div>` : `D${d.day_number}`}</div>
            <div class="day-info">
              <div class="t">${d.title || (d.is_rest_day?'יום מנוחה':'אימון')} ${isToday ? '<span class="today-badge">היום</span>' : ''}</div>
              ${d.description ? `<div class="d">${d.description}</div>` : ''}
            </div>
            ${d.is_rest_day ? `<span class="badge">מנוחה</span>` : (exs.length ? `<span class="badge">${exs.length} תרגילים</span>` : '')}
            <button class="icon-btn" data-trainee-move="${d.id}" data-daynum="${d.day_number}" title="החלפת יום" onclick="event.stopPropagation()">↕</button>
            ${!d.is_rest_day ? `<span class="chevron">▾</span>` : ''}
          </div>
          ${!d.is_rest_day ? `<div class="day-card-body">
            ${exs.map(ex => {
              const last = findLastLoggedValues(ex.name, days, d.day_number);
              return `
              <div class="exercise-item ${ex.completed?'ex-done':''}" data-exid="${ex.id}">
                <div class="ex-name">${findLibraryInstructions(ex.name) ? `<span class="info-dot" data-instr="${ex.name.replace(/"/g,'&quot;')}">i</span>` : ''}<span data-history="${ex.name.replace(/"/g,'&quot;')}" style="cursor:pointer;text-decoration:underline dotted;">${ex.name} <span style="font-size:11px;color:var(--blue-bright);">📈 היסטוריה</span></span></div>
                <div class="ex-target">יעד: ${ex.target_sets ?? '—'} סטים × ${ex.target_reps ?? '—'} חזרות${ex.target_weight_kg!=null ? ` · ${ex.target_weight_kg} ק"ג` : ''}</div>
                <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;">
                  ${ex.video_url ? `<button class="video-link-btn" data-watch="${ex.video_url.replace(/"/g,'&quot;')}">▶ צפייה בסרטון הדרכה</button>` : ''}
                  <button class="video-link-btn" data-swap-ex="${ex.id}" data-ex-name="${ex.name.replace(/"/g,'&quot;')}" style="background:var(--bg-elevated);color:var(--muted);">🔄 החלפת תרגיל</button>
                </div>
                ${last ? `<button class="same-last-btn" data-samelast="${ex.id}" data-sets="${last.sets ?? ''}" data-reps="${(last.reps||'').replace(/"/g,'&quot;')}" data-weight="${last.weight ?? ''}">🔁 כמו בפעם הקודמת (${last.weight ?? '—'} ק"ג × ${last.reps ?? '—'})</button>` : ''}
                <div class="ex-log-grid">
                  <div class="f"><label>סטים בפועל</label><input type="number" class="ex-sets" value="${ex.actual_sets ?? ''}"></div>
                  <div class="f"><label>חזרות בפועל</label><input class="ex-reps" value="${ex.actual_reps ?? ''}"></div>
                  <div class="f"><label>ק"ג בפועל</label><input type="number" step="0.5" class="ex-weight" value="${ex.actual_weight_kg ?? ''}"></div>
                  <button class="btn small ex-save">${ex.completed ? '✓ עודכן' : 'שמירה'}</button>
                </div>
              </div>`;
            }).join('')}
            <div style="margin-top:12px;">
              <label style="font-size:12px;color:var(--muted);display:block;margin-bottom:6px;">הערה/שאלה למאמן על היום הזה</label>
              <textarea class="trainee-note-input" data-noteday="${d.id}" rows="2" placeholder="לדוגמה: הרגשתי כאב בברך בסקוואט...">${d.trainee_note || ''}</textarea>
              <button class="btn ghost small note-save-btn" data-noteday="${d.id}" style="margin-top:6px;">שמירת הערה</button>
            </div>
          </div>` : ''}
        </div>`;
      }).join('') : `<div class="empty">${logoSVG(46)}<div>אין עדיין תוכנית פעילה</div></div>`}
    </div>
  `;

  const reminderBtn = document.getElementById('reminderLogBtn');
  if(reminderBtn) reminderBtn.onclick = renderTraineeProgress;
  const myBoardBtn = document.getElementById('myBoardBtn');
  if(myBoardBtn) myBoardBtn.onclick = () => openAdherenceBoardModal(program, renderTraineeHome);
  const todayBtn = document.getElementById('todayWorkoutBtn');
  if(todayBtn && todaysDay){
    todayBtn.onclick = () => {
      const card = document.querySelector(`[data-daycard="${todaysDay.id}"]`);
      if(card){
        card.classList.add('expanded');
        card.scrollIntoView({ behavior:'smooth', block:'center' });
        card.style.outline = '2px solid var(--blue-bright)';
        setTimeout(()=>{ card.style.outline = ''; }, 2000);
      }
    };
  }

  document.querySelectorAll('[data-toggle]').forEach(head => {
    head.onclick = () => {
      const card = document.querySelector(`[data-daycard="${head.getAttribute('data-toggle')}"]`);
      if(card && card.querySelector('.day-card-body')) card.classList.toggle('expanded');
    };
  });

  // החלקה (swipe) על כרטיס יום במובייל = סימון/ביטול סימון כבוצע, בלי לפתוח את הכרטיס
  document.querySelectorAll('.day-card:not(.rest)').forEach(card => {
    let startX = null, startY = null, dragging = false;
    card.addEventListener('touchstart', (ev) => {
      startX = ev.touches[0].clientX; startY = ev.touches[0].clientY; dragging = true;
    }, { passive:true });
    card.addEventListener('touchmove', (ev) => {
      if(!dragging || startX===null) return;
      const dx = ev.touches[0].clientX - startX;
      const dy = ev.touches[0].clientY - startY;
      if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 15){
        card.style.transform = `translateX(${dx*0.3}px)`;
      }
    }, { passive:true });
    card.addEventListener('touchend', (ev) => {
      card.style.transform = '';
      if(!dragging || startX===null) return;
      const dx = (ev.changedTouches[0].clientX - startX);
      const dy = (ev.changedTouches[0].clientY - startY);
      dragging = false; startX = null;
      if(Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)){
        const cb = card.querySelector('.day-check');
        if(cb && !cb.disabled){ cb.checked = !cb.checked; cb.dispatchEvent(new Event('change')); }
      }
    });
  });

  document.querySelectorAll('[data-trainee-move]').forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      const dayId = btn.getAttribute('data-trainee-move');
      const currentNum = parseInt(btn.getAttribute('data-daynum'));
      openMoveDayModal(dayId, currentNum, program, renderTraineeHome);
    };
  });

  document.querySelectorAll('[data-history]').forEach(el => {
    el.onclick = (ev) => {
      ev.stopPropagation();
      openExerciseHistoryModal(el.getAttribute('data-history'), days, program ? program.start_date : null);
    };
  });

  document.querySelectorAll('[data-instr]').forEach(el => {
    el.onclick = (ev) => {
      ev.stopPropagation();
      const instr = findLibraryInstructions(el.getAttribute('data-instr'));
      const bg = document.createElement('div');
      bg.className = 'modal-bg';
      bg.innerHTML = `<div class="modal"><h3>${el.getAttribute('data-instr')}</h3><p style="font-size:13px;color:var(--muted);line-height:1.7;">${instr}</p><div class="modal-actions"><button class="btn full" id="instrClose">סגירה</button></div></div>`;
      document.body.appendChild(bg);
      document.getElementById('instrClose').onclick = () => bg.remove();
      bg.onclick = (e2) => { if(e2.target === bg) bg.remove(); };
    };
  });

  document.querySelectorAll('.note-save-btn').forEach(btn => {
    btn.onclick = async (ev) => {
      ev.stopPropagation();
      const dayId = btn.getAttribute('data-noteday');
      const textarea = document.querySelector(`.trainee-note-input[data-noteday="${dayId}"]`);
      try{
        await rest('program_days', { method:'PATCH', query:`?id=eq.${dayId}`, body:{ trainee_note: textarea.value.trim() } });
        showToast('ההערה נשמרה - המאמן/ת יראה אותה');
      }catch(e){ showToast(e.message, true); }
    };
  });

  document.querySelectorAll('[data-watch]').forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      openVideoModal(btn.getAttribute('data-watch'));
    };
  });

  document.querySelectorAll('[data-swap-ex]').forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      const exId = btn.getAttribute('data-swap-ex');
      const currentName = btn.getAttribute('data-ex-name');
      const category = findLibraryCategory(currentName);
      openLibraryPicker(async (item) => {
        try{
          await rest('exercises', { method:'PATCH', query:`?id=eq.${exId}`, body:{
            name: item.name,
            actual_sets: null, actual_reps: null, actual_weight_kg: null, completed: false, video_url: null
          }});
          showToast(`הוחלף ל-"${item.name}"`);
          renderTraineeHome();
        }catch(e){ showToast(e.message, true); }
      }, category || '', `החלפת "${currentName}" בתרגיל אחר${category ? ' (' + category + ')' : ''}`);
    };
  });

  document.querySelectorAll('[data-samelast]').forEach(btn => {
    btn.onclick = (ev) => {
      ev.stopPropagation();
      const item = btn.closest('.exercise-item');
      item.querySelector('.ex-sets').value = btn.getAttribute('data-sets') || '';
      item.querySelector('.ex-reps').value = btn.getAttribute('data-reps') || '';
      item.querySelector('.ex-weight').value = btn.getAttribute('data-weight') || '';
    };
  });

  document.querySelectorAll('.exercise-item').forEach(item => {
    const saveBtn = item.querySelector('.ex-save');
    saveBtn.onclick = async (ev) => {
      ev.stopPropagation();
      const exId = item.getAttribute('data-exid');
      const sets = item.querySelector('.ex-sets').value;
      const reps = item.querySelector('.ex-reps').value;
      const weight = item.querySelector('.ex-weight').value;
      try{
        await rest('exercises', { method:'PATCH', query:`?id=eq.${exId}`, body:{
          actual_sets: sets===''?null:parseInt(sets),
          actual_reps: reps===''?null:reps,
          actual_weight_kg: weight===''?null:parseFloat(weight),
          completed: true
        }});
        item.classList.add('ex-done');
        saveBtn.textContent = '✓ עודכן';
        showToast('התרגיל נשמר');
        startRestTimer(90);
      }catch(e){ showToast(e.message, true); }
    };
  });

  document.querySelectorAll('.day-check').forEach(cb => {
    cb.onchange = async () => {
      try{
        await rest('program_days', {
          method:'PATCH',
          query:`?id=eq.${cb.getAttribute('data-dayid')}`,
          body:{ completed: cb.checked, completed_at: cb.checked ? new Date().toISOString() : null }
        });
        showToast(cb.checked ? randomMotivation() : 'הסימון בוטל');
        const container = cb.closest('.day-card') || cb.closest('.day-row');
        if(container) container.classList.toggle('done', cb.checked);
      }catch(e){ showToast(e.message, true); cb.checked = !cb.checked; }
    };
  });
  maybeShowWelcome();
}

async function renderTraineeProgress(){
  const app = document.getElementById('app');
  app.innerHTML = appShell(
    [{key:'program', label:'📋 התוכנית שלי'}, {key:'nutrition', label:'🍽 התפריט שלי'}, {key:'progress', label:'📈 ההתקדמות שלי'}],
    'progress',
    `<div class="skeleton skel-block"></div><div class="skeleton skel-row"></div><div class="skeleton skel-row"></div>`
  );
  bindShellNav({ program: renderTraineeHome, nutrition: renderTraineeNutrition, progress: renderTraineeProgress });

  let entries = [];
  try{
    entries = await rest('progress_entries', { query:`?trainee_id=eq.${PROFILE.id}&select=*&order=entry_date.asc` }) || [];
  }catch(e){ showToast(e.message, true); }

  const goalWeight = PROFILE.goal_weight_kg;
  const weightEntries = entries.filter(p=>p.weight_kg!=null);
  const chartPoints = weightEntries.map((p,i)=>({x:i,y:parseFloat(p.weight_kg)}));
  const photoEntries = entries.filter(p=>p.photo_url);
  const firstPhoto = photoEntries[0];
  const lastPhoto = photoEntries[photoEntries.length-1];

  const badges = [];
  if(entries.length >= 1) badges.push({icon:'🎯', label:'מדידה ראשונה'});
  if(entries.length >= 5) badges.push({icon:'📏', label:'5+ מדידות'});
  if(entries.length >= 10) badges.push({icon:'📊', label:'10+ מדידות'});
  if(weightEntries.length >= 2){
    const diff = weightEntries[0].weight_kg - weightEntries[weightEntries.length-1].weight_kg;
    if(diff >= 1) badges.push({icon:'⚖️', label:`ירידה של ${diff.toFixed(1)} ק"ג`});
    if(diff >= 5) badges.push({icon:'🏆', label:'ירידה של 5+ ק"ג'});
  }
  if(entries.length >= 2){
    const spanDays = Math.floor((new Date(entries[entries.length-1].entry_date) - new Date(entries[0].entry_date))/86400000);
    if(spanDays >= 30) badges.push({icon:'🗓', label:'חודש של מעקב'});
    if(spanDays >= 90) badges.push({icon:'🌟', label:'3 חודשים של מעקב'});
  }
  if(photoEntries.length >= 2) badges.push({icon:'📸', label:'מעקב עם תמונות'});
  if(goalWeight!=null && weightEntries.length && Math.abs(weightEntries[weightEntries.length-1].weight_kg - goalWeight) < 0.5) badges.push({icon:'🎉', label:'הגעת ליעד!'});

  const measureOptions = [
    {key:'weight_kg', label:'משקל (ק"ג)'}, {key:'chest_cm', label:'חזה (ס"מ)'}, {key:'waist_cm', label:'מותן (ס"מ)'},
    {key:'hips_cm', label:'ירכיים (ס"מ)'}, {key:'arm_cm', label:'זרוע (ס"מ)'}, {key:'thigh_cm', label:'ירך (ס"מ)'}
  ];

  document.querySelector('.main').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:14px;">
      <div>
        <h2 class="page-title">ההתקדמות שלי</h2>
        <p class="page-sub">משקל והיקפים לאורך זמן</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn ghost small" id="exportBtn">⬇ ייצוא CSV</button>
        <button class="btn" id="logBtn">+ רישום מדידה</button>
      </div>
    </div>

    ${badges.length ? `
    <div class="panel" style="margin-bottom:16px;">
      <h3>הישגים</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        ${badges.map(b => `<div class="streak-badge" style="background:var(--bg-elevated);color:var(--white);border:1px solid var(--border);">${b.icon} ${b.label}</div>`).join('')}
      </div>
    </div>` : ''}

    ${(firstPhoto && lastPhoto && firstPhoto.id !== lastPhoto.id) ? `
    <div class="panel" style="margin-bottom:16px;">
      <h3>לפני / אחרי</h3>
      <div class="grid cols-2">
        <div>
          <img src="${firstPhoto.photo_url}" style="width:100%;border-radius:10px;border:1px solid var(--border);">
          <div class="muted" style="font-size:12px;margin-top:6px;text-align:center;">${new Date(firstPhoto.entry_date).toLocaleDateString('he-IL')}${firstPhoto.weight_kg?` · ${firstPhoto.weight_kg} ק"ג`:''}</div>
        </div>
        <div>
          <img src="${lastPhoto.photo_url}" style="width:100%;border-radius:10px;border:1px solid var(--border);">
          <div class="muted" style="font-size:12px;margin-top:6px;text-align:center;">${new Date(lastPhoto.entry_date).toLocaleDateString('he-IL')}${lastPhoto.weight_kg?` · ${lastPhoto.weight_kg} ק"ג`:''}</div>
        </div>
      </div>
    </div>` : ''}

    <div class="panel" style="margin-bottom:16px;">
      <h3>יעד משקל</h3>
      <div style="display:flex;justify-content:flex-end;margin-top:-30px;"><button class="linklike" id="editGoalBtn">${goalWeight!=null ? 'עריכה' : '+ הגדרת יעד'}</button></div>
      <div style="font-family:var(--font-mono);font-size:22px;font-weight:800;margin-top:8px;">
        ${goalWeight!=null ? `${goalWeight} ק"ג` : `<span class="muted" style="font-size:13px;font-weight:600;">לא הוגדר יעד עדיין</span>`}
      </div>
    </div>

    <div class="panel" style="margin-bottom:16px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="margin:0;">מגמה</h3>
        <select id="measureSelect" style="width:auto;padding:6px 10px;font-size:12px;">
          ${measureOptions.map(m => `<option value="${m.key}">${m.label}</option>`).join('')}
        </select>
      </div>
      <div id="measureChart" style="margin-top:10px;">${svgLineChart(chartPoints, 560, 160, goalWeight)}</div>
    </div>

    <div class="panel">
      <h3>היסטוריה</h3>
      ${entries.length ? `<table>
        <tr><th></th><th>תאריך</th><th>משקל</th><th>חזה</th><th>מותן</th><th>ירכיים</th><th>זרוע</th><th>ירך</th></tr>
        ${entries.slice().reverse().map(p => `<tr>
          <td>${p.photo_url ? `<img class="photo-thumb" src="${p.photo_url}" data-full="${p.photo_url}">` : ''}</td>
          <td>${new Date(p.entry_date).toLocaleDateString('he-IL')}</td>
          <td>${p.weight_kg ?? '-'}</td><td>${p.chest_cm ?? '-'}</td><td>${p.waist_cm ?? '-'}</td>
          <td>${p.hips_cm ?? '-'}</td><td>${p.arm_cm ?? '-'}</td><td>${p.thigh_cm ?? '-'}</td>
        </tr>`).join('')}
      </table>` : `<div class="empty">עדיין לא הזנת מדידות. לחצי על "רישום מדידה" כדי להתחיל.</div>`}
    </div>
  `;
  document.getElementById('measureSelect').onchange = (ev) => {
    const key = ev.target.value;
    const pts = entries.filter(p=>p[key]!=null).map((p,i)=>({x:i,y:parseFloat(p[key])}));
    document.getElementById('measureChart').innerHTML = svgLineChart(pts, 560, 160, key==='weight_kg'?goalWeight:null);
  };
  document.getElementById('logBtn').onclick = openLogProgressModal;
  document.getElementById('editGoalBtn').onclick = openGoalModal;
  document.getElementById('exportBtn').onclick = () => {
    if(!entries.length){ showToast('אין נתונים לייצוא', true); return; }
    exportCSV(`motion-progress-${PROFILE.full_name}.csv`,
      ['תאריך','משקל','חזה','מותן','ירכיים','זרוע','ירך','הערות'],
      entries.map(p => [new Date(p.entry_date).toLocaleDateString('he-IL'), p.weight_kg, p.chest_cm, p.waist_cm, p.hips_cm, p.arm_cm, p.thigh_cm, p.notes])
    );
  };
  document.querySelectorAll('.photo-thumb').forEach(img => {
    img.onclick = () => {
      const lb = document.createElement('div');
      lb.className = 'lightbox-bg';
      lb.innerHTML = `<img src="${img.getAttribute('data-full')}">`;
      lb.onclick = () => lb.remove();
      document.body.appendChild(lb);
    };
  });
}

function openGoalModal(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <h3>הגדרת יעד משקל</h3>
      <div class="field"><label>משקל יעד (ק"ג)</label><input id="gWeight" type="number" step="0.1" value="${PROFILE.goal_weight_kg ?? ''}"></div>
      <div id="gErr" class="error hidden"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="gCancel">ביטול</button>
        <button class="btn full" id="gSave">שמירה</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  document.getElementById('gCancel').onclick = () => bg.remove();
  document.getElementById('gSave').onclick = async () => {
    const v = document.getElementById('gWeight').value;
    try{
      await rest('profiles', { method:'PATCH', query:`?id=eq.${PROFILE.id}`, body:{ goal_weight_kg: v===''?null:parseFloat(v) } });
      PROFILE.goal_weight_kg = v===''?null:parseFloat(v);
      bg.remove();
      showToast('היעד נשמר');
      renderTraineeProgress();
    }catch(e){
      document.getElementById('gErr').textContent = e.message;
      document.getElementById('gErr').classList.remove('hidden');
    }
  };
}

async function openLogProgressModal(){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  let last = null;
  try{
    const rows = await rest('progress_entries', { query:`?trainee_id=eq.${PROFILE.id}&select=*&order=entry_date.desc&limit=1` });
    last = rows && rows[0];
  }catch(e){}
  bg.innerHTML = `
    <div class="modal">
      <h3>רישום מדידה חדשה</h3>
      ${last ? `<p class="muted" style="font-size:12px;margin-top:-8px;">מולא אוטומטית מהמדידה הקודמת - עדכני רק מה שהשתנה</p>` : ''}
      <div class="field"><label>תאריך</label><input id="eDate" type="date" value="${new Date().toISOString().slice(0,10)}"></div>
      <div class="grid cols-2">
        <div class="field"><label>משקל (ק"ג)</label><input id="eWeight" type="number" step="0.1" value="${last?.weight_kg ?? ''}"></div>
        <div class="field"><label>חזה (ס"מ)</label><input id="eChest" type="number" step="0.1" value="${last?.chest_cm ?? ''}"></div>
        <div class="field"><label>מותן (ס"מ)</label><input id="eWaist" type="number" step="0.1" value="${last?.waist_cm ?? ''}"></div>
        <div class="field"><label>ירכיים (ס"מ)</label><input id="eHips" type="number" step="0.1" value="${last?.hips_cm ?? ''}"></div>
        <div class="field"><label>זרוע (ס"מ)</label><input id="eArm" type="number" step="0.1" value="${last?.arm_cm ?? ''}"></div>
        <div class="field"><label>ירך (ס"מ)</label><input id="eThigh" type="number" step="0.1" value="${last?.thigh_cm ?? ''}"></div>
      </div>
      <div class="field"><label>הערות</label><textarea id="eNotes" rows="2"></textarea></div>
      <div class="field">
        <label>תמונת התקדמות (אופציונלי)</label>
        <input id="ePhoto" type="file" accept="image/*">
        <img id="ePhotoPreview" class="photo-preview">
      </div>
      <div id="eErr" class="error hidden"></div>
      <div class="modal-actions">
        <button class="btn ghost" id="eCancel">ביטול</button>
        <button class="btn full" id="eSave">שמירה</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  document.getElementById('eCancel').onclick = () => bg.remove();
  document.getElementById('ePhoto').onchange = (ev) => {
    const file = ev.target.files[0];
    const preview = document.getElementById('ePhotoPreview');
    if(file){ preview.src = URL.createObjectURL(file); preview.style.display = 'block'; }
    else{ preview.style.display = 'none'; }
  };
  document.getElementById('eSave').onclick = async () => {
    const num = id => { const v = document.getElementById(id).value; return v === '' ? null : parseFloat(v); };
    const saveBtn = document.getElementById('eSave');
    saveBtn.disabled = true; saveBtn.textContent = 'שומרת...';
    try{
      let photo_url = null;
      const file = document.getElementById('ePhoto').files[0];
      if(file) photo_url = await uploadPhoto(file, PROFILE.id);
      await rest('progress_entries', { method:'POST', body:{
        trainee_id: PROFILE.id,
        entry_date: document.getElementById('eDate').value,
        weight_kg: num('eWeight'), chest_cm: num('eChest'), waist_cm: num('eWaist'),
        hips_cm: num('eHips'), arm_cm: num('eArm'), thigh_cm: num('eThigh'),
        notes: document.getElementById('eNotes').value.trim(),
        photo_url
      }});
      bg.remove();
      showToast('המדידה נשמרה');
      renderTraineeProgress();
    }catch(e){
      document.getElementById('eErr').textContent = e.message;
      document.getElementById('eErr').classList.remove('hidden');
      saveBtn.disabled = false; saveBtn.textContent = 'שמירה';
    }
  };
}

/* =====================================================================
   ראוטר ראשי
   ===================================================================== */
function render(){
  stopRestTimer();
  if(STATE.view === 'config') return renderConfig();
  if(STATE.view === 'auth') return renderAuth();
  if(STATE.view === 'coach') return renderCoachHome();
  if(STATE.view === 'trainee') return renderTraineeHome();
}

/* Enter בתוך שדה טקסט בתוך מודל לוחץ אוטומטית על כפתור הפעולה הראשי (חוסך צורך לגעת בעכבר/מסך) */
document.addEventListener('keydown', (ev) => {
  if(ev.key !== 'Enter') return;
  const tag = ev.target.tagName;
  if(tag === 'TEXTAREA') return; // בטקסט ארוך, Enter אמור ליצור שורה חדשה
  const modal = ev.target.closest('.modal');
  if(!modal) return;
  const actions = modal.querySelector('.modal-actions');
  if(!actions) return;
  const primaryBtn = actions.querySelector('.btn.full') || actions.querySelector('.btn:not(.ghost)');
  if(primaryBtn && !primaryBtn.disabled){
    ev.preventDefault();
    primaryBtn.click();
  }
});

(async function boot(){
  document.getElementById('app').innerHTML = `<div class="centerscreen">${motionMark(38,true)}</div>`;
  const sessRaw = (function(){ try{ return localStorage.getItem('motion_session'); }catch(e){ return null; } })();
  STATE.view = 'auth';
  if(sessRaw){
    const restored = await tryRestoreSession();
    if(!restored) STATE.view = 'auth';
  }
  render();
})();
</script>
